<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430" role="img" aria-label="看起来都是矩阵，行的含义却变了">
 <title>看起来都是矩阵，行的含义却变了</title><desc>词表有多少项、句子有多少个位置、向量有多长，是三件不同的事。</desc>
