 <rect x="1" y="1" width="1098" height="428" rx="20" fill="url(#bg)" stroke="#d0d7de"/>
 <g font-family="system-ui, PingFang SC, Microsoft YaHei, sans-serif"><text x="32" y="76" fill="#1f2328" font-size="28" font-weight="650">看起来都是矩阵，行的含义却变了</text>
 <text x="32" y="107" fill="#57606a" font-size="15">词表有多少项、句子有多少个位置、向量有多长，是三件不同的事。</text>
