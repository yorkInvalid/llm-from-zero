<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" viewBox="0 0 1100 360" role="img" aria-label="相同的文字，两条处理路径">
 <title>相同的文字，两条处理路径</title><desc>实验中的变量是操作顺序：先拼文字，还是先分词？</desc>
 <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1529"/><stop offset="1" stop-color="#19243f"/></linearGradient><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#68c7d1" stroke-opacity=".07"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#76ddd5"/></marker></defs>
 <rect width="1100" height="360" rx="20" fill="url(#bg)"/><rect width="1100" height="360" rx="20" fill="url(#grid)"/>
 <g font-family="system-ui, PingFang SC, Microsoft YaHei, sans-serif"><text x="32" y="35" fill="#74ddd3" font-size="12" letter-spacing="2">MODEL INPUT LAB / 05</text>
 <text x="32" y="76" fill="#f1f5ff" font-size="28" font-weight="650">相同的文字，两条处理路径</text>
 <text x="32" y="107" fill="#bdcbe0" font-size="15">实验中的变量是操作顺序：先拼文字，还是先分词？</text>
 <rect x="32" y="139" width="180" height="78" rx="12" fill="#14243c" stroke="#75e0d3" stroke-opacity=".65"/><text x="48" y="174" fill="#75e0d3" font-size="20" font-weight="600">片段 A + B</text><text x="48" y="205" fill="#dde6f7" font-size="14">先拼接文字</text><path d="M224 178L267 178" stroke="#76ddd5" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="280" y="139" width="250" height="78" rx="12" fill="#14243c" stroke="#75e0d3" stroke-opacity=".65"/><text x="296" y="174" fill="#75e0d3" font-size="20" font-weight="600">整体 encode</text><text x="296" y="205" fill="#dde6f7" font-size="14">一次重新分词</text><path d="M542 178L594 178" stroke="#76ddd5" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="608" y="139" width="250" height="78" rx="12" fill="#14243c" stroke="#75e0d3" stroke-opacity=".65"/><text x="624" y="174" fill="#75e0d3" font-size="20" font-weight="600">ID 序列 ①</text><text x="624" y="205" fill="#dde6f7" font-size="14">记录编号和数量</text><rect x="32" y="244" width="180" height="78" rx="12" fill="#14243c" stroke="#75e0d3" stroke-opacity=".65"/><text x="48" y="279" fill="#75e0d3" font-size="20" font-weight="600">片段 A、B</text><text x="48" y="310" fill="#dde6f7" font-size="14">暂时保留分段</text><path d="M224 283L267 283" stroke="#76ddd5" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="280" y="244" width="250" height="78" rx="12" fill="#14243c" stroke="#75e0d3" stroke-opacity=".65"/><text x="296" y="279" fill="#75e0d3" font-size="20" font-weight="600">分别 encode</text><text x="296" y="310" fill="#dde6f7" font-size="14">各自编码，再连接编号</text><path d="M542 283L594 283" stroke="#76ddd5" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="608" y="244" width="250" height="78" rx="12" fill="#14243c" stroke="#b4a0ff" stroke-opacity=".65"/><text x="624" y="279" fill="#b4a0ff" font-size="20" font-weight="600">ID 序列 ②</text><text x="624" y="310" fill="#dde6f7" font-size="14">与上面逐项比较</text><text x="888" y="202" fill="#f1c98b" font-size="17">它们一定</text><text x="888" y="230" fill="#f1c98b" font-size="17">相同吗？</text><text x="888" y="267" fill="#bdcbe0" font-size="14">先预测，再找证据。</text></g></svg>