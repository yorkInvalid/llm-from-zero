<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" viewBox="0 0 1100 360" role="img" aria-label="从一句话，追踪到一张矩阵">
 <title>从一句话，追踪到一张矩阵</title><desc>先看全景。每个箭头，后面都有一个可以亲手操作的实验。</desc>
 <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1529"/><stop offset="1" stop-color="#19243f"/></linearGradient><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#68c7d1" stroke-opacity=".07"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#76ddd5"/></marker></defs>
 <rect width="1100" height="360" rx="20" fill="url(#bg)"/><rect width="1100" height="360" rx="20" fill="url(#grid)"/>
 <g font-family="system-ui, PingFang SC, Microsoft YaHei, sans-serif"><text x="32" y="35" fill="#74ddd3" font-size="12" letter-spacing="2">MODEL INPUT LAB / 05</text>
 <text x="32" y="76" fill="#f1f5ff" font-size="28" font-weight="650">从一句话，追踪到一张矩阵</text>
 <text x="32" y="107" fill="#bdcbe0" font-size="15">先看全景。每个箭头，后面都有一个可以亲手操作的实验。</text>
 <rect x="32" y="155" width="188" height="92" rx="12" fill="#14243c" stroke="#75e0d3" stroke-opacity=".65"/><text x="48" y="190" fill="#75e0d3" font-size="20" font-weight="600">文字</text><text x="48" y="221" fill="#dde6f7" font-size="14">我们读得懂的输入</text><path d="M223 201L240 201" stroke="#76ddd5" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="244" y="155" width="188" height="92" rx="12" fill="#14243c" stroke="#75e0d3" stroke-opacity=".65"/><text x="260" y="190" fill="#75e0d3" font-size="20" font-weight="600">token ID [T]</text><text x="260" y="221" fill="#dde6f7" font-size="14">词表中的编号</text><path d="M435 201L452 201" stroke="#76ddd5" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="456" y="155" width="188" height="92" rx="12" fill="#14243c" stroke="#b4a0ff" stroke-opacity=".65"/><text x="472" y="190" fill="#b4a0ff" font-size="20" font-weight="600">查表 E[V,D]</text><text x="472" y="221" fill="#dde6f7" font-size="14">按编号取出向量</text><path d="M647 201L664 201" stroke="#76ddd5" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="668" y="155" width="188" height="92" rx="12" fill="#14243c" stroke="#75e0d3" stroke-opacity=".65"/><text x="684" y="190" fill="#75e0d3" font-size="20" font-weight="600">输入矩阵 [T,D]</text><text x="684" y="221" fill="#dde6f7" font-size="14">每个位置一行</text><path d="M859 201L876 201" stroke="#76ddd5" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="880" y="155" width="188" height="92" rx="12" fill="#14243c" stroke="#75e0d3" stroke-opacity=".65"/><text x="896" y="190" fill="#75e0d3" font-size="20" font-weight="600">后续网络</text><text x="896" y="221" fill="#dde6f7" font-size="14">结合上下文继续计算</text><text x="32" y="294" fill="#f1c98b" font-size="16">本课观察到输入表示这一步：分词器和随机教学表都不等于完整语言模型。</text><text x="32" y="326" fill="#bdcbe0" font-size="14">科研搭档：先看每一步的数据长什么样，再用你的代码证明它们怎样连接。</text></g></svg>