<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="440" viewBox="0 0 1080 440">
<rect width="1080" height="440" rx="20" fill="#f4f7fc"/>
<g font-family="Arial, PingFang SC, sans-serif" fill="#23354d">
<text x="34" y="48" font-size="25" font-weight="bold">同一份资料，经过两条路径</text>
<text x="34" y="92" font-size="18" fill="#4167a4">入库：资料新增或变化时</text>
<g fill="#e3ecff" stroke="#9bb7e8"><rect x="34" y="112" width="190" height="66" rx="12"/><rect x="280" y="112" width="190" height="66" rx="12"/><rect x="526" y="112" width="190" height="66" rx="12"/><rect x="772" y="112" width="270" height="66" rx="12"/></g>
<g font-size="19" text-anchor="middle"><text x="129" y="152">三份中文原文</text><text x="375" y="152">切成片段</text><text x="621" y="152">BGE → 向量</text><text x="907" y="152">Chroma 保存对应记录</text><text x="251" y="152">→</text><text x="497" y="152">→</text><text x="744" y="152">→</text></g>
<text x="790" y="206" font-size="15">文字 + 向量 + 编号 + 来源</text>
<text x="34" y="252" font-size="18" fill="#26745f">提问：每次请求时</text>
<g fill="#dff2ea" stroke="#98c9b8"><rect x="34" y="274" width="180" height="66" rx="12"/><rect x="262" y="274" width="200" height="66" rx="12"/><rect x="510" y="274" width="235" height="66" rx="12"/><rect x="793" y="274" width="249" height="66" rx="12"/></g>
<g font-size="18" text-anchor="middle"><text x="124" y="314">问题 → BGE 向量</text><text x="362" y="314">Chroma 找候选片段</text><text x="627" y="314">问题 + 片段原文 → 消息</text><text x="917" y="314">回答 API → 回答与引用</text><text x="239" y="314">→</text><text x="487" y="314">→</text><text x="768" y="314">→</text></g>
<text x="34" y="394" font-size="18">向量帮助找资料；生成模型收到的是检索出的文字。两种模型都没有在本课中训练。</text>
</g></svg>
