<script id="flow-payload" type="application/json">{"checkpoint": "industry-33m-continue/best.pt", "config": {"vocab_size": 8192, "d_model": 512, "num_layers": 8, "num_heads": 8, "dropout": 0.1, "context_length": 256, "pad_id": 0, "norm_style": "pre", "norm_type": "rms", "position_encoding": "rope", "ffn_type": "swiglu"}, "text": "现在,人工智能大约是唯一一个,能够让国内三大互联网巨头BAT同时上线一争高下的领域. 2017年,BAT全面高调入局AI.百度说要\"All in AI\",腾讯则强调\"AI in All\".马云年初启动了NASA计划,下半年再次决定千亿投入达摩院,阿里云开始布局\"产业AI\".在此之前,移动互联网的半壁江山,都被BAT所占领.而如今,\"人工智能\"正在成为BAT新的主要投资标的. 如果说之前对人工智能的投入还只是试水,那么从现在开始,战争的硝烟已经可见.新一局的\"三国杀\",正在BAT中开展.它们为自己所规划的战略和扮演的角色,也逐渐露出了端倪. 逐鹿下一个时代 马云说:\"阿里巴巴必须是一家创造未来的公司.\"实际上,不止阿里,公司做到BAT这个量级,它们所思考的,也都更多的是如何下注新一个时代.而现在,它们都纷纷把宝押在了人工智能之上. 第四届世界互联网大会上,李彦宏就说:\"去年我讲,移动互联网时代已经结束,下一幕是人工智能.当时很多人不同意,他们说只是进入了移动互联网的下半场.今年,之前讲下半场的人,都开始讲人工智能了.\"话里话外,李彦宏有按捺不住的得意. 人工智能技术,已然成为移动互联网之后不能忽略的桥头堡.互联网时代的真谛是流量.搜索之于百度,电商之于阿里,社交之于腾讯,殊途同归的是,在那个年头,谁抢占的流量越多,谁就能占山为王. 从PC时期到移动互联网时期,流量争夺的本质虽然尚在,但流量的载体已经发生了变化,移动端的信息交互方式,发生了不同以往的变革. 在一年多以前,百度曾经被很多人目之为\"掉队\"了.甚至有不少人提出,BAT将被\"TMD\"所取代.那是因为,在移动互联网上,百度在搜索引擎方面的优势,随着浏览器和桌面在移动端的改变而被削弱,滴滴,美团点评等应用接替了垂直消费场景中的搜索,而颠覆了传统媒体广告市场的,则是今日头条. 但是,移动时代也带来了数据的爆发.线上积淀的海量数据的处理,清洗,分析,管理,对传统的软件,存储,计算资源等,都是巨大挑战,也是巨大机会. 人工智能已经是第三次浪潮.现在的AI技术,还远无法到达我们对强人工智能的想象,也没有形成当年移动互联网启动的商业市场. 据BBC预测,2020年,全球AI市场规模,将达到1190亿元人民币,这个数字,甚至还比不上两年前的国内移动互联网的产业规模.但是,在人力已经无法解决的海量数据的处理,挖掘,预测方面,机器开启了无数的想象力. 深度学习带来的这一波AI浪潮的\"技术红利\",对于云计算,大数据,移动互联网,物联网而言,都是一次产业升级迭代的机会.当PC和移动互联网的流量红利要趋于消亡,产业需要更强大的服务引擎和动力. 美国的互联网巨头,无论是Google还是亚马逊,Facebook,在满足更多的2C用户基础上,也都在布局企业服务领域,以接入更广大企业客户需求.而其中,最主要的未来技术,就是人工智能. 在这个变革时代前奏响起的时刻,没有一个巨头,愿意放弃这个筹码.经过几年积累,BAT的人工智能战略和业务领域已经渐渐清晰,而它们的布局,也对众多关键领域产生了巨大影响. 三足鼎立 1,百度:ALL in AI的中国版Google? 2017年,在不到半年的时间里市值上涨了300多亿美元,依靠人工智能技术和信息流广告,百度俨然复苏. 百度以搜索引擎起家,搜索重算法.因此,百度也成为在人工智能领域最早布局,也最早在深度学习上加以应用的公司. 从PC时代依靠搜索引擎建立了江湖地位的百度,也曾在移动互联网时代尝试更多的业务.但在不断试错后,百度最终还是选择了回归技术. 2017年初,李彦宏在新年公开信中表示,人工智能和内容分发,将成为百度新的战略重点.这一年,虽然有首席科学家吴恩达,高级副总裁王劲等的离职,但是百度迎来了微软前全球执行副总裁陆奇的加盟,担任总裁和COO. 陆奇的加入,也推动了百度向开放,生态的路子上走去.百度进行了组织架构调整,剥离外卖等O2O业务,在搜索之外,全面向一家技术平台公司转型. 围绕着底层技术,百度走向应用场景落地.百度将DuerOS比喻为AI时代的安卓操作系统,将语音作为入口,切入家居,可穿戴,手机,车载等场景.而Apollo则可以说是自动驾驶领域的安卓.搜索引擎先天的AI基因赋予了百度优势,依靠数据和算法基础,拓展到实践领域,百度就能打通进入更多产业的关卡. 提到安卓,这不得不令人联想到Google.2018年CES开幕之前,陆奇在拉斯维加斯说:\"百度就是中国版的Google.\" 在Google的开放生态下,Google Assistant已经覆盖了超过1亿台设备,接入了越来越多的终端,提供庞大的数据,将其培养成不断强大的AI服务平台.而在自动驾驶平台的开放上,百度已经走在了Google的前面. 2,阿里:云+ET大脑,真正的商业服务 面对去年围棋世界冠军柯洁败于AlphaGo的消息,\"文科生\"马云说:\"So what?\" 但这并不意味着马云不关注人工智能,实际上,他强调的是物联网和\"机器智能\".和马云一贯的商业精神一脉相承,阿里的AI策略,无论是做什么,都要先确认商业落点. 阿里没有百度的底层技术实力,但是阿里基于电商平台,在大数据上早早就押了宝.早在9年前,阿里开始开拓云计算领域;如今,阿里云平台的服务已经覆盖了全球200多个国家和地区.在3年前,马云就说:人类正从IT时代走向DT时代. 云计算+大数据,再加上AI技术的福能,阿里云从人工智能ET进化到如今的ET大脑,在城市大脑,医疗大脑,工业大脑等领域,将阿里的计算能力和数据处理能力输出到零售,金融,医疗,交通等行业. 今年3月,阿里启动NASA计划.今年4月,阿里面向开发者的AliGenie语音开放平台推出,同时亮相的,还有阿里的智能家居硬件天猫精灵音箱.10月,阿里宣布成立达摩院,计划三年内投入千亿元,对量子计算,基础算法,网络安全等领域进行研发. (阿里宣布成立达摩院) 另外一个电商帝国亚马逊,正围绕自己的电商业务,云服务AWS以及语音平台Alexa,智能音箱Echo等,建立了独特的商业生态.而同样作为电商和云计算巨头,阿里的野心已然表露无遗. 腾讯:AI in All,沿着场景应用技术 腾讯在人工智能领域的起步,仿佛比百度和阿里慢了一拍.在项目上,腾讯也更偏向于技术实验,例如在日本UEC杯夺冠的围棋AI\"绝艺\". 马化腾说:\"如果没有场景落地,业务没办法往下走.\"腾讯的人工智能技术,也围绕着自带的应用展开.比如腾讯对微信朋友圈和QQ空间上十亿的人脸照片,利用人脸图片识别技术进行了研究,包括一些后台的定向技术,数据分析,广告和内容服务,金融服务等,也都用上了人工智能技术,但大都在后端. 2016年,腾讯开设了人工智能实验室AI Lab,属于腾讯技术工程事业群,聚焦计算机视觉,语音识别,自然语言处理和机器学习等基础研究,并在2017年邀请前百度研究院副院长张潼加盟,担任AI Lab 主任.据张潼曾向黑智透露,AI Lab根据腾讯业务,主要针对游戏,内容,社交,搜索及工具平台型AI等应用方向. 腾讯在AI的布局上,主要以自身业务为驱动,具备极强的目的性.现在,腾讯的AI技术也走向开放.去年11月,腾讯公布了自己的AI战略 - - \"AI in all\",把腾讯的AI技术开放出来,和行业结合,主要落地内容,游戏,医疗,零售,金融,安防,翻译,社交八大场景. 2017年,腾讯发布了AI医疗影像系统\"觅影\",对食道癌等病症进行早期筛查和诊断;同年腾讯还推出了语音助手\"叮当\"和智能语音平台\"腾讯云小微\". BAT的AI战略各不相同,但是在相关产业领域,它们已经展开了碰撞.而诸如智能家居,汽车,医疗等行业,在BAT的\"入侵\"下,产业格局也悄然发生了改变. BAT在哪些领域\"相杀\"? 1,语音:共同的物联网时代\"卡位\"梦想 2017年,国内的互联网巨头纷纷锁定了智能语音市场. 去年7月5日,百度宣称,要让开放的DuerOS成为回到时代巅峰的关键;就在同一天,阿里的智能音箱天猫精灵和中文人机交流系统AliGenie面世.彼时,腾讯叮当推出两个月,云小微刚刚问世一个月. 语音作为被寄予厚望的下一代核心的入口级产品,亚马逊Echo点燃了海内外几乎所有科技巨头的热情.BAT不约而同地,从类似亚马逊Alexa的平台入手开始切入. 作为互联网时代大厂,它们更理解\"开放\"的意义:在系统级层面开源,承载更多的服务和硬件合作伙伴,链接起更多的终端,为实现\"万物互联\"场景,建立新的生态平台. 百度度秘事业部总经理景鲲说,在百度眼中,DuerOS就是\"人工智能时代的安卓\".它的目的,就是让每个开发者,能够以低门槛迅速打造属于自己的智能语音交互设备. 为了构建起生态,百度收购了创业公司KITT.AI以获取技术,成为业界少有的软硬件一体的解决方案.通过开源的技术,开发者可以实现不同场景的应用,即使是海外的设备,也能够通过接入DuerOS轻松入华.同时,百度也推出了搭载DuerOS2.0的智能硬件渡鸦raven H等. (百度智能硬件渡鸦raven H) 阿里的天猫精灵和Echo一样,在音乐播放之外,还可实现智能家居控制,语音购物,手机充值,叫外卖,充话费等功能.它内置了AliGenie语音助手和开发者平台,通过它开发者可以链接到阿里生态体系中的消费者和生活,商业场景. 今年1月,阿里AI Lab发布了智联网开放连接协议IoTConnect,让智能设备能够实现连接,自动组网,自动适配和支持天猫精灵的语音控制. 阿里或许没有百度在智能语音交互上深厚的技术积累,但在这个平台上,阿里更强调的,是产品未来所能提供的服务能力.阿里的优势是,和亚马逊一样,具备独特的商业生态,产品自带商业场景. \"腾讯叮当\"也出现在了今年的CES上.腾讯的内部产品研发的\"多线并行\"的习惯,让产品的定位和差异还不是非常清晰.但是,布局智能语音,收集更多的数据,辅助自己在智能家居,车载,智慧城市方面提供助力,是BAT共同的\"物联网\"时代平台梦想. 2,智能出行:车内圈地 汽车产业正迎来新一波革命,而BAT,正在对其进行全面的\"入侵\". 去年10月,阿里和上汽合资的斑马网络推出了升级为2.0版本的斑马智行系统,并和神龙汽车合作,首款搭载了AliOS的智能汽车将落地东风雪铁龙.11月,李彦宏宣布百度的无人驾驶小巴车将在2018年实现小规模量产和试运营;同时,DuerOS车载版独立,推出Apollo小度车载系统.11月8日,腾讯在全球合作伙伴大会上,推出了车联\"AI in Car\"系统,开放腾讯基于AI的链接能力和生态资源. BAT和整车厂商的关系也变得紧密.\"北上广\"三大车厂,分别成为了它们的盟友:阿里和上汽的合作由来已久;2017年9月,腾讯和广汽签署在车联网,智能驾驶等领域合作的框架协议;10月,百度和北汽签署合作协议.当前国内的新能源汽车制造创业公司中,BAT也全部到位:百度和腾讯投资了蔚来汽车和威马汽车,阿里则入局了小鹏汽车. 除此之外,BAT的\"圈地运动\"中,还曾包括智能后视镜,车载盒子等各类产品. 汽车产业正处于向电动化和智能化转型升级的窗口期,智能化趋势,已经势不可挡.这个巨大的市场,没有人想错过,BAT也不例外,尽管姿势各不相同. 自动驾驶领域,百度无疑是走得最远的公司.李彦宏乘坐百度自家的自动驾驶汽车上了北京的五环,不仅引发了热烈讨论,还收获了国内无人驾驶领域的第一张交通罚单. 2017年底,百度的自动驾驶车队雄赳赳地开上了雄安新区的街头.百度的Apollo自动驾驶平台日前公布了2.0版本,Apollo合作伙伴规模突破90家. 按照陆奇的说法,Apollo就是自动驾驶领域的安卓系统,但会更加开放.Apollo平台和小度车载系统,将向未来的车厂提供更开放的软件平台和车载操作系统,让它们可以快速搭建自己的自动驾驶系统. 阿里CEO张勇曾经说过,阿里\"不会做无人驾驶\".但阿里打造车载操作系统方面的动作,却一直都在进行. 2014年,阿里就上汽达成了战略合作,共同打造互联网汽车.2015年,阿里还曾和中国兵器工业集团共同成立了千寻位置网络有限公司.斑马智行系统中,可以绑定支付宝缴费,还引入了旅游路线引导,打包销售酒店和门票预订等功能.阿里的车载操作系统,秉承了其一贯的\"商业优先\"的风格. 相比之下,腾讯的重点仍在于布局联合车企的投资上,其车载系统,也更多地是在车内场景,引入其擅长的内容和社交服务.其\"AI in Car\"系统仍然立足于腾讯的社交优势,基于腾讯研发的车联网安全体系,搭载后可以在车内安全接收QQ和微信的信息. 但BAT的入局,已经让整车厂,Tier1和车联网,车机厂商之间的供应关系,悄然产生了变化.汽车产业的价值链,或许也将重塑. 3,医疗:AI大脑,让技术的归技术 2017年,阿里云ET医疗大脑正式发布,进军医疗AI领域.阿里表示,ET医疗大脑,已经可以在患者虚拟助理,医学影像,精准医疗等领域承担医生助手的角色. 阿里云总裁胡晓明在年初曾对黑智表示,人工智能系统辅助医疗,并不是取代医生,ET医疗大脑将辅助医生诊断和分析结果,提高诊断速度,同时促进算法迭代. 这不由得让我们联想到百度近年来在医疗大脑上的投入.2016年10月,\"百度医疗大脑\"在北京发布,它是通过海量医疗数据,专业文献的采集与分析进行人工智能化的产品设计. 最初百度的医疗布局主要集中在医疗信息搜索,进而扩展到挂号预约等服务,在线问诊,送药电商等.去年2月,百度正式宣布将医疗业务的重点布局在人工智能领域,原百度医疗事业部业务关停.李彦宏对此给出的解释是:百度将会利用人工智能,继续参与医疗领域.比如智能挂号,智能诊疗,收集基因数据,制药研发等. 在社交和通信方面占优的腾讯,则更重视利用自己在社交方面的优势,从流量入口切入医疗市场.好大夫,微医,丁香园,医联,卓健等互联网医疗公司,以及医美O2O平台新氧,更美,均有腾讯的投资.腾讯正试图通过自身的大数据能力,以及产品平台上的用户触达能力,整合医疗分发平台,成为连接起医疗机构和患者之间的一级入口. 同时,腾讯也在加强\"AI+医疗\"的产品落地.去年8月,腾讯首款人工智能医疗影像产品\"腾讯觅影\"正式发布,并发起成立了AI医学影像联合实验室.目前,腾讯觅影已经从医疗影像应用扩展到AI辅助诊疗. 多年以来,BAT都没有放弃在互联网医疗的布局.但是,它们不得不面对的问题是,在这块领域,巨头们的相关产品却举步维艰.医疗领域和互联网的开放环境大不相同,资源的稀缺及垄断,政策的高监管性,数据的封闭,疾病市场的碎片化,都和BAT熟悉的领域大相径庭. 这次,大厂们选择了另外一条弯道超车:让技术的,归于技术.它们甩掉了医疗中劳动密集的相关环节,聚焦在技术本身,要用人工智能技术,提升医疗本身最核心的诊疗环节的能力. 在更多的产业中,BAT也正成为不可忽视的变量.\"新零售\"如火如荼时,在今年双十一,阿里的人工智能设计师\"鲁班\"生成了4亿个定制的横幅广告;淘宝的聊天机器人在预售期间每天回答350万个简单提问;阿里巴巴计算资源AI分配官\"达灵\"将数据中心资源分配率拉升到了90%以上. 百度正在试图开启一个\"手机AI\"时代.去年11 月百度宣布与小米在人工智能和物联网科技方面的合作关系后,12月,李彦宏又牵起了余承东的手.百度的AI技术将更多地在华为终端上落地,直接触达消费者. 陆奇说,\"China+ AI\"将释放更多的AI创新.这是一个时代的变革期,虽然是为不确定的未来\"押宝\",但站在这个路口的,不仅是BAT,也包括所有的企业和资本. (责任编辑:DF207)", "utf8": [231, 142, 176, 229, 156, 168, 44, 228, 186, 186, 229, 183, 165, 230, 153, 186, 232, 131, 189, 229, 164, 167, 231, 186, 166, 230, 152, 175, 229, 148, 175, 228, 184, 128], "utf8_text": "现在,人工智能大约是唯一", "ids": [1, 1063, 14, 338, 3925, 286, 3172, 426, 14, 809, 750, 1370, 2675, 1143, 2196, 4704, 1028, 4745, 288, 1262, 463, 2885, 542, 16, 3139, 419, 14, 4704, 2015, 463, 961, 545, 962, 383, 16, 1239, 589, 359, 4, 6257, 2026, 1025, 806, 1975, 876, 2890, 4, 383, 2026, 1306, 4593, 1087, 5536, 7378, 3738, 328, 48, 4258, 35, 1710, 14, 483, 5158, 4219, 1828, 6460, 1755, 3620, 14, 4063, 1066, 1641, 4, 642, 383, 1087, 3826, 1662, 14, 4231, 261, 1875, 895, 226, 2134, 1805, 14, 568, 723, 4704, 505, 1576, 475, 16, 447, 2143, 1149, 338, 4, 1250, 880, 4704, 1059, 931, 1447, 562, 261, 16, 3379, 589, 1662, 4619, 1755, 610, 1907, 813, 1120, 14, 1305, 487, 1063, 1066, 14, 4540, 261, 471, 254, 5941, 794, 3501, 16, 1567, 962, 261, 4, 771, 378, 5408, 806, 1250, 4704, 320, 2270, 16, 1300, 316, 1163, 505, 1489, 4723, 306, 6605, 261, 3362, 14, 452, 2188, 2785, 1733, 947, 523, 106, 16, 223, 1520, 3550, 126, 3713, 1099, 223, 5536, 589, 1467, 2296, 1418 在,它们都纷纷把宝押在了人工智能之上.\n  第四届世界互联网大会上,李彦宏就说:\"去年我讲,移动互联网时代已经结束,下一幕是人工智能.当时很多人不同意,他们说只是进入了移动互联网的下半场.今年,之前讲下半场的人,都开始讲人工智能了.\"话里话外,李彦宏有按捺不住的得意.  人工智能技术,已然成为移动互联网之后不能忽略的桥头堡.互联网时代的真谛是流量.搜索之于百度,电商之于阿里,社交之于腾讯,殊途同归的是,在那个年头,谁抢占的流量越多,谁就能占山为王.\n  从PC时期到移动互联网时期,流量争夺的本质虽然尚在,但流量的载体已经发生了变化,移动端的信息交互方式,发生了不同以往的变革.\n  在一年多以前,百度曾经被很多人目之为\"掉队\"了.甚至有不少人提出,BAT将被\"TMD\"所取代.那是因为,在移动互联网上,百度在搜索引擎方面的优势,随着浏览器和桌面在移动端的改变而被削弱,滴滴,美团点评等应用接替了垂直消费场景中的搜索,而颠覆了传统媒体广告市场的,则是今日头条.\n  但是,移动时代也带来了数据的爆发.线上积淀的海量数据的处理,清洗,分析,管理,对传统的软件,存储,计算资源等,都是巨大挑战,也是巨大机会.\n  人工智能已经是第三次浪潮.现在的AI技术,还远无法到达我们对强人工智能的想象,也没有形成当年移动互联网启动的商业市场.\n  据BBC预测,2020年,全球AI市场规模,将达到1190亿元人民币,这个数字,甚至还比不上两年前的国内移动互联网的产业规模.但是,在人力已经无法解决的海量数据的处理,挖掘,预测方面,机器开启了无数的想象力.\n  深度学习带来的这一波AI浪潮的\"技术红利\",对于云计算,大数据,移动互联网,物联网而言,都是一次产业升级迭代的机会.当PC和移动互联网的流量红利要趋于消亡,产业需要更强大的服务引擎和动力.\n  美国的互联网巨头,无论是Google还是亚马逊,Facebook,在满足更多的2C用户基础上,也都在布局企业服务领域,以接入更广大企业客户需求.而其中,最主要的未来技术,就是人工智能.\n  在这个变革时代前奏响起的时刻,没有一个巨头,愿意放弃这个筹码.经过几年积累,BAT的人工智能战略和业务领域已经渐渐清晰,而它们的布局,也对众多关键领域产生了巨大影响.\n  三足鼎立\n  1,百度:ALL in AI的中国版Google?\n  2017年,在不到半年的时间里市值上涨了300多亿美元,依靠人工智能技术和信息流广告,百度俨然复苏.\n  百度以搜索引擎起家,搜索重算法.因此,百度也成为在人工智能领域最早布局,也最早在深度学习上加以应用的公司.\n  从PC时代依靠搜索引擎建立了江湖地位的百度,也曾在移动互联网时代尝试更多的业务.但在不断试错后,百度最终还是选择了回归技术.\n  2017年初,李彦宏在新年公开信中表示,人工智能和内容分发,将成为百度新的战略重点.这一年,虽然有首席科学家吴恩达,高级副总裁王劲等的离职,但是百度迎来了微软前全球执行副总裁陆奇的加盟,担任总裁和COO.\n  陆奇的加入,也推动了百度向开放,生态的路子上走去.百度进行了组织架构调整,剥离外卖等O2O业务,在搜索之外,全面向一家技术平台公司转型.\n  围绕着底层技术,百度走向应用场景落地.百度将DuerOS比喻为AI时代的安卓操作系统,将语音作为入口,切入家居,可穿戴,手机,车载等场景.而Apollo则可以说是自动驾驶领域的安卓.搜索引擎先天的AI基因赋予了百度优势,依靠数据和算法基础,拓展到实践领域,百度就能打通进入更多产业的关卡.\n  提到安卓,这不得不令人联想到Google.2018年CES开幕之前,陆奇在拉斯维加斯说:\"百度就是中国版的Google.\"\n  在Google的开放生态下,Google Assistant已经覆盖了超过1亿台设备,接入了越来越多的终端,提供庞大的数据,将其培养成不断强大的AI服务平台.而在自动驾驶平台的开放上,百度已经走在了Google的前面.\n  2,阿里:云+ET大脑,真正的商业服务\n  面对去年围棋世界冠军柯洁败于AlphaGo的消息,\"文科生\"马云说:\"So what?\"\n  但这并不意味着马云不关注人工智能,实际上,他强调的是物联网和\"机器智能\".和马云一贯的商业精神一脉相承,阿里的AI策略,无论是做什么,都要先确认商业落点.\n  阿里没有百度的底层技术实力,但是阿里基于电商平台,在大数据上早早就押了宝.早在9年前,阿里开始开拓云计算领域;如今,阿里云平台的服务已经覆盖了全球200多个国家和地区.在3年前,马云就说:人类正从IT时代走向DT时代.\n  云计算+大数据,再加上AI技术的福能,阿里云从人工智能ET进化到如今的ET大脑,在城市大脑,医疗大脑,工业大脑等领域,将阿里的计算能力和数据处理能力输出到零售,金融,医疗,交通等行业.\n  今年3月,阿里启动NASA计划.今年4月,阿里面向开发者的AliGenie语音开放平台推出,同时亮相的,还有阿里的智能家居硬件天猫精灵音箱.10月,阿里宣布成立达摩院,计划三年内投入千亿元,对量子计算,基础算法,网络安全等领域进行研发.\n(阿里宣布成立达摩院)  另外一个电商帝国亚马逊,正围绕自己的电商业务,云服务AWS以及语音平台Alexa,智能音箱Echo等,建立了独特的商业生态.而同样作为电商和云计算巨头,阿里的野心已然表露无遗.\n  腾讯:AI in All,沿着场景应用技术\n  腾讯在人工智能领域的起步,仿佛比百度和阿里慢了一拍.在项目上,腾讯也更偏向于技术实验,例如在日本UEC杯夺冠的围棋AI\"绝艺\".\n  马化腾说:\"如果没有场景落地,业务没办法往下走.\"腾讯的人工智能技术,也围绕着自带的应用展开.比如腾讯对微信朋友圈和QQ空间上十亿的人脸照片,利用人脸图片识别技术进行了研究,包括一些后台的定向技术,数据分析,广告和内容服务,金融服务等,也都用上了人工智能技术,但大都在后端.\n  2016年,腾讯开设了人工智能实验室AI Lab,属于腾讯技术工程事业群,聚焦计算机视觉,语音识别,自然语言处理和机器学习等基础研究,并在2017年邀请前百度研究院副院长张潼加盟,担任AI Lab 主任.据张潼曾向黑智透露,AI Lab根据腾讯业务,主要针对游戏,内容,社交,搜索及工具平台型AI等应用方向.  腾讯在AI的布局上,主要以自身业务为驱动,具备极强的目的性.现在,腾讯的AI技术也走向开放.去年11月,腾讯公布了自己的AI战略 -  - \"AI in all\",把腾讯的AI技术开放出来,和行业结合,主要落地内容,游戏,医疗,零售,金融,安防,翻译,社交八大场景.\n  2017年,腾讯发布了AI医疗影像系统\"觅影\",对食道癌等病症进行早期筛查和诊断;同年腾讯还推出了语音助手\"叮当\"和智能语音平台\"腾讯云小微\".\n  BAT的AI战略各不相同,但是在相关产业领域,它们已经展开了碰撞.而诸如智能家居,汽车,医疗等行业,在BAT的\"入侵\"下,产业格局也悄然发生了改变.\n  BAT在哪些领域\"相杀\"?\n  1,语音:共同的物联网时代\"卡位\"梦想\n  2017年,国内的互联网巨头纷纷锁定了智能语音市场.\n  去年7月5日,百度宣称,要让开放的DuerOS成为回到时代巅峰的关键;就在同一天,阿里的智能音箱天猫精灵和中文人机交流系统AliGenie面世.彼时,腾讯叮当推出两个月,云小微刚刚问世一个月.\n  语音作为被寄予厚望的下一代核心的入口级产品,亚马逊Echo点燃了海内外几乎所有科技巨头的热情.BAT不约而同地,从类似亚马逊Alexa的平台入手开始切入.\n  作为互联网时代大厂,它们更理解\"开放\"的意义:在系统级层面开源,承载更多的服务和硬件合作伙伴,链接起更多的终端,为实现\"万物互联\"场景,建立新的生态平台.\n  百度度秘事业部总经理景鲲说,在百度眼中,DuerOS就是\"人工智能时代的安卓\".它的目的,就是让每个开发者,能够以低门槛迅速打造属于自己的智能语音交互设备.\n  为了构建起生态,百度收购了创业公司KITT.AI以获取技术,成为业界少有的软硬件一体的解决方案.通过开源的技术,开发者可以实现不同场景的应用,即使是海外的设备,也能够通过接入DuerOS轻松入华.同时,百度也推出了搭载DuerOS2.0的智能硬件渡鸦raven H等.\n(百度智能硬件渡鸦raven H)  阿里的天猫精灵和Echo一样,在音乐播放之外,还可实现智能家居控制,语音购物,手机充值,叫外卖,充话费等功能.它内置了AliGenie语音助手和开发者平台,通过它开发者可以链接到阿里生态体系中的消费者和生活,商业场景.\n  今年1月,阿里AI Lab发布了智联网开放连接协议IoTConnect,让智能设备能够实现连接,自动组网,自动适配和支持天猫精灵的语音控制.\n  阿里或许没有百度在智能语音交互上深厚的技术积累,但在这个平台上,阿里更强调的,是产品未来所能提供的服务能力.阿里的优势是,和亚马逊一样,具备独特的商业生态,产品自带商业场景.\n  \"腾讯叮当\"也出现在了今年的CES上.腾讯的内部产品研发的\"多线并行\"的习惯,让产品的定位和差异还不是非常清晰.但是,布局智能语音,收集更多的数据,辅助自己在智能家居,车载,智慧城市方面提供助力,是BAT共同的\"物联网\"时代平台梦想.\n  2,智能出行:车内圈地\n  汽车产业正迎来新一波革命,而BAT,正在对其进行全面的\"入侵\".\n  去年10月,阿里和上汽合资的斑马网络推出了升级为2.0版本的斑马智行系统,并和神龙汽车合作,首款搭载了AliOS的智能汽车将落地东风雪铁龙.11月,李彦宏宣布百度的无人驾驶小巴车将在2018年实现小规模量产和试运营;同时,DuerOS车载版独立,推出Apollo小度车载系统.11月8日,腾讯在全球合作伙伴大会上,推出了车联\"AI in Car\"系统,开放腾讯基于AI的链接能力和生态资源.\n  BAT和整车厂商的关系也变得紧密.\"北上广\"三大车厂,分别成为了它们的盟友:阿里和上汽的合作由来已久;2017年9月,腾讯和广汽签署在车联网,智能驾驶等领域合作的框架协议;10月,百度和北汽签署合作协议.当前国内的新能源汽车制造创业公司中,BAT也全部到位:百度和腾讯投资了蔚来汽车和威马汽车,阿里则入局了小鹏汽车.\n  除此之外,BAT的\"圈地运动\"中,还曾包括智能后视镜,车载盒子等各类产品.\n  汽车产业正处于向电动化和智能化转型升级的窗口期,智能化趋势,已经势不可挡.这个巨大的市场,没有人想错过,BAT也不例外,尽管姿势各不相同.\n  自动驾驶领域,百度无疑是走得最远的公司.李彦宏乘坐百度自家的自动驾驶汽车上了北京的五环,不仅引发了热烈讨论,还收获了国内无人驾驶领域的第一张交通罚单.\n  2017年底,百度的自动驾驶车队雄赳赳地开上了雄安新区的街头.百度的Apollo自动驾驶平台日前公布了2.0版本,Apollo合作伙伴规模突破90家.\n  按照陆奇的说法,Apollo就是自动驾驶领域的安卓系统,但会更加开放.Apollo平台和小度车载系统,将向未来的车厂提供更开放的软件平台和车载操作系统,让它们可以快速搭建自己的自动驾驶系统.\n  阿里CEO张勇曾经说过,阿里\"不会做无人驾驶\".但阿里打造车载操作系统方面的动作,却一直都在进行.\n  2014年,阿里就上汽达成了战略合作,共同打造互联网汽车.2015年,阿里还曾和中国兵器工业集团共同成立了千寻位置网络有限公司.斑马智行系统中,可以绑定支付宝缴费,还引入了旅游路线引导,打包销售酒店和门票预订等功能.阿里的车载操作系统,秉承了其一贯的\"商业优先\"的风格.\n  相比之下,腾讯的重点仍在于布局联合车企的投资上,其车载系统,也更多地是在车内场景,引入其擅长的内容和社交服务.其\"AI in Car\"系统仍然立足于腾讯的社交优势,基于腾讯研发的车联网安全体系,搭载后可以在车内安全接收QQ和微信的信息.\n  但BAT的入局,已经让整车厂,Tier1和车联网,车机厂商之间的供应关系,悄然产生了变化.汽车产业的价值链,或许也将重塑.\n  3,医疗:AI大脑,让技术的归技术\n  2017年,阿里云ET医疗大脑正式发布,进军医疗AI领域.阿里表示,ET医疗大脑,已经可以在患者虚拟助理,医学影像,精准医疗等领域承担医生助手的角色.\n  阿里云总裁胡晓明在年初曾对黑智表示,人工智能系统辅助医疗,并不是取代医生,ET医疗大脑将辅助医生诊断和分析结果,提高诊断速度,同时促进算法迭代.\n  这不由得让我们联想到百度近年来在医疗大脑上的投入.2016年10月,\"百度医疗大脑\"在北京发布,它是通过海量医疗数据,专业文献的采集与分析进行人工智能化的产品设计.\n  最初百度的医疗布局主要集中在医疗信息搜索,进而扩展到挂号预约等服务,在线问诊,送药电商等.去年2月,百度正式宣布将医疗业务的重点布局在人工智能领域,原百度医疗事业部业务关停.李彦宏对此给出的解释是:百度将会利用人工智能,继续参与医疗领域.比如智能挂号,智能诊疗,收集基因数据,制药研发等.\n  在社交和通信方面占优的腾讯,则更重视利用自己在社交方面的优势,从流量入口切入医疗市场.好大夫,微医,丁香园,医联,卓健等互联网医疗公司,以及医美O2O平台新氧,更美,均有腾讯的投资.腾讯正试图通过自身的大数据能力,以及产品平台上的用户触达能力,整合医疗分发平台,成为连接起医疗机构和患者之间的一级入口.\n  同时,腾讯也在加强\"AI+医疗\"的产品落地.去年8月,腾讯首款人工智能医疗影像产品\"腾讯觅影\"正式发布,并发起成立了AI医学影像联合实验室.目前,腾讯觅影已经从医疗影像应用扩展到AI辅助诊疗.\n  多年以来,BAT都没有放弃在互联网医疗的布局.但是,它们不得不面对的问题是,在这块领域,巨头们的相关产品却举步维艰.医疗领域和互联网的开放环境大不相同,资源的稀缺及垄断,政策的高监管性,数据的封闭,疾病市场的碎片化,都和BAT熟悉的领域大相径庭.\n  这次,大厂们选择了另外一条弯道超车:让技术的,归于技术.它们甩掉了医疗中劳动密集的相关环节,聚焦在技术本身,要用人工智能技术,提升医疗本身最核心的诊疗环节的能力.\n  在更多的产业中,BAT也正成为不可忽视的变量.\"新零售\"如火如荼时,在今年双十一,阿里的人工智能设计师\"鲁班\"生成了4亿个定制的横幅广告;淘宝的聊天机器人在预售期间每天回答350万个简单提问;阿里巴巴计算资源AI分配官\"达灵\"将数据中心资源分配率拉升到了90%以上.\n  百度正在试图开启一个\"手机AI\"时代.去年11 月百度宣布与小米在人工智能和物联网科技方面的合作关系后,12月,李彦宏又牵起了余承东的手.百度的AI技术将更多地在华为终端上落地,直接触达消费者.\n  陆奇说,\"China+ AI\"将释放更多的AI创新.这是一个时代的变革期,虽然是为不确定的未来\"押宝\",但站在这个路口的,不仅是BAT,也包括所有的企业和资本.\n(责任编辑:DF207)", "quality_score": 4.0703125}, "source": {"source": "/Users/yorkchen/文稿 - 陈尧的MacBook Pro/VibeCoding/llm-from-zero/06-attention/artifacts/book-lm/industry-data/sample.txt", "sha256": "ba4169e377ab54edb2281b1218f6f58e3506576f19efefa61629ffe8e800bcc5", "bytes": 2607098, "paragraphs": {"train": 320, "validation": 40, "test": 41}, "vocab_size": 8192, "split_rule": "unique paragraphs, original order, 80/10/10; tokenizer trained on train only", "eos_meaning": "end of paragraph document, not arbitrary window boundary", "dataset": "BAAI/IndustryCorpus2", "revision": "249ea52f1ee412303e9741ae69fdd2109c0f8e1c", "shard": "artificial_intelligence_machine_learning/chinese/high/rank_00012.parquet", "row_group": 0, "seed": 42, "characters": 1000710, "sampling": "unique normalized documents, 200..20000 chars; shuffled first row group; bounded prefix", "document_hashes": ["66a41c9e8794a0db4f8629d733fe5a626276de57bb886da9d4832b09da72ebdc", "81cc73c3372948371ea98f4cc5c2d79ca91f2caa20ea51b3ce4b64413b0e3033", "dc7ee9b1d3083a7757383e5ddfe679ab5be29745eaf32c2090458432550c7e73", "8b63a2ec2c3e0b631fec4860b5b05365370097ffa3c3743dd2916d9510fc3f3f", "1c99a94b769f63c11155dc80b3699b0be6b0f438619b92d26774a9fe22efc77f", "82e29e776a0a722fa41cbe71c9247dcd8a57d4271e240d510740bff3c267783c", "68535f45cecb55c6349f908a6e3601e81031dafe93cdba958d6c1754efb6398c", "d07d8119ee2ac4d32990ff030629db83bdad58ee29f0f930949312e61adb0499", "833eb4b0f1e9705c7bf03333049bf87561679b4962a072cdd4281a1129696177", "383676086d3861879884dfcc2a7b3ee3b9c8f6327b86b324c3b210fce25bca58", "5759584997f475df79da44955fa0e027cddf0b4d3598fa367ac97899ac42b3d3", "b45c31d02bfcc29e8  if(step===1)html=`<h3>完整文档去重 → 固定种子打乱 → 80 / 10 / 10</h3>${table(['处理','实际结果'],[['读取范围','一个中文高质量 AI 分片，非全语料随机抽样'],['筛选','200–20000 字符；空白折叠；精确去重'],['训练','320 篇 · 463801 个目标 token'],['验证','40 篇 · 62320 个目标 token'],['测试（本次诊断不读取）','41 篇 · 上次统计 57023 个目标 token'],['分词器','仅用训练集拟合 · 8192 词表'],['当前样本','验证集第 1 篇；未用于拟合 tokenizer']])}<label>清理后的同一文档（前 700 字符）</label><pre>${esc(d.text.slice(0,700))}</pre>`;
 if(step===2)html=`<h3>Unicode 文本 → UTF-8 字节 → ByteLevel BPE</h3><pre>${esc(d.utf8_text)}</pre>${tokens(d.utf8)}<label>BPE 结果（开头 12 枚；单枚字节片段可能不能独立还原中文）</label>${table(['位置','BPE 内部表示','单枚解码','ID'],d.tokens.slice(1,13).map((t,i)=>[i+1,t,d.decoded[i+1],d.ids[i+1]]))}`;
 if(step===3)html=`<h3>BOS → 正文 tokens → EOS</h3>${table(['项目','数值'],[['正文 token 数',d.ids.length-2],['BOS / EOS / PAD','1 / 2 / 0'],['实际序列长度',d.ids.length]])}<label>序列开头 24 枚</label>${tokens(d.ids.slice(0,24))}<label>序列末尾 8 枚</label>${tokens(d.ids.slice(-8))}`;
 if(step===4)html=`<h3>上下文 256 · 同一文档保留在同一集合</h3>${table(['窗口','原序列起点','输入长度','首输入 ID','末标签 ID'],d.windows.map((w,i)=>[i,w.start,w.length,w.input[0],w.labels.at(-1)]))}<label>相邻窗口共享边界 token 作输入；每个下一 token 目标只计一次。仅文档末尾有 EOS。</label>`;
 if(step===5)html=`<h3>input = piece[:-1] · labels = piece[1:]</h3>${table(['位置','输入文本','input ID','下一 token（目标）','label ID'],d.rows.slice(0,16).map(r=>[r.position,d.decoded[r.position],r.input_id,r.label,r.label_id]))}`;
 if(step===6){const len=d.batch.input[0].length;html=`<h3>同一文档的首窗口 + 末窗口 → batch [2, ${len}]</h3>${table(['样本','有效长度','末 12 个 input ID','末 12 个 label ID'],d.batch.input.map((r,i)=>[i,d.batch.lengths[i],r.slice(-12).join(', '),d.batch.labels[i].slice(-12).join(', ')]))}<label>右侧 PAD 输入=0；PAD 标签=-100，不计算 loss。PAD key 不参与注意力。</label>`;}
 if(step===7)html=`<h3>ID → 查表 [2,256,512] → 转置 → 8 个 block → logits [2,256,8192]</h3><label>真实 Embedding 数值：前 6 token × 前 6 维（512 维中的切片）</label>${table(['token','d0','d1','d2','d3','d4','d5'],d.embedding.slice(0,6).map((r,i)=>[d.decoded[i],...r.slice(0,6).map(f)]))}<label>每层：RMSNorm → RoPE 因果注意力 → 残差 → RMSNorm → SwiGLU → 残差</label>${table(['层','输出形状','输出 RMS'],d.layers.map(r=>[r.layer,r.shape.join(' × '),f(r.rms)]))}`;
 if(step===8){const p=Math.min(position,15);const mask=table(['key / query',...Array.from({length:16},(_,i)=>i)],Array.from({length:16},(_,k)=>[k,...Array.from({length:16},(_,q)=>k<=q?'○':'×')]));html=`<h3>第 1 层 / 第 1 头 · 前 16 个位置</h3><label>○ 可读取 · × 未来屏蔽；行=key，列=query</label>${mask}<label class="form-label">Query 位置 ${p}<input id="position" class="form-range" type="range" min="0" max="15" value="${p}"></label>${table(['Key 位置','token','可见','对当前 query 的实际权重'],d.attention.map((r,i)=>[i,d.decoded[i],i<=p?'是':'未来 · 屏蔽',r[p].toFixed(6)]))}`;}
 if(step===9){const r=d.rows[position];html=`<h3>真实前缀条件下的下一 token 预测</h3><label class="form-label">输入位置 ${position}<input id="position" class="form-range" type="range" min="0" max="31" value="${position}"></label>${table(['项目','数值'],[['输入 ID',r.input_id],['真实目标',r.label+' · ID '+r.label_id],['目标概率',(r.true_probability*100).toFixed(3)+'%'],['该位置 loss = -ln(p)',f(r.loss)],['完整 batch 平均 loss',f(d.batch_loss)],['有效标签数',d.valid_labels]])}${table(['Top 5 token','ID','概率'],r.predictions.map(v=>[v.text,v.id,(v.probability*100).toFixed(3)+'%']))}`;}
 if(step===10)html=`<h3>loss → backward → 梯度 → optimizer.step</h3>${table(['阶段','实际数值'],[['教学单步 loss',f(d.update_demo.loss)],['Embedding 梯度范数',f(d.update_demo.embedding_gradient_norm)],['一次 Adam 更新后的变化范数',f(d.update_demo.embedding_update_norm)],['实验范围','在内存副本上更新；未覆盖训练权重；eval 模式关闭 dropout']])}`;
 if(step===11)html=`<h3>当前最佳权重 · 贪心生成 32 枚 token</h3>${d.predictions.map(p=>`<label>${esc(p.prompt)}</label><pre>${esc(p.text)}</pre>${table(['下一 token Top 5','概率'],p.top5.map(v=>[v.text,(v.probability*100).toFixed(2)+'%']))}`).join('')}`;
 content.innerHTML=`<div class="stack">${html}</div>`;
 const slider=root.querySelector('#position');if(slider)slider.onchange=e=>{position=Number(e.target.value);render();save();};
}
select.onchange=()=>{step=Number(select.value);render();save();};
root.querySelector('#flow-prev').onclick=()=>{step--;render();save();};root.querySelector('#flow-next').onclick=()=>{step++;render();save();};
function restore(s){const p=s?.privateContent;if(p){step=Math.min(11,Math.max(0,Number(p.step)||0));position=Math.min(31,Math.max(0,Number(p.position)||0));}render();}
window.addEventListener('openai:set_globals',e=>restore(e.detail?.globals?.widgetState));restore(window.openai?.widgetState);
})();
</script>
