&lt;script type=&quot;application/json&quot; id=&quot;codex-visualization-widget-state&quot;&gt;__CODEX_VISUALIZATION_WIDGET_STATE__&lt;/script&gt;
&lt;script&gt;(() =&gt; {
  const root = document.documentElement;
  const mediaQuery = globalThis.matchMedia(&quot;(prefers-color-scheme: dark)&quot;);
  const apply = Reflect.apply;
  const isArray = Array.isArray;
  const hasOwn = Object.hasOwn;
  const parentWindow = globalThis.parent;
  const stringify = JSON.stringify;
  const parse = JSON.parse;
  const encode = TextEncoder.prototype.encode.bind(new TextEncoder());
  const initialStateElement = document.getElementById(
    &quot;codex-visualization-widget-state&quot;,
  );
  const initialGlobals = parse(initialStateElement?.textContent ?? &quot;{}&quot;);
  initialStateElement?.remove();
  /** @type {Record&lt;string, unknown&gt; | null} */
  let state = initialGlobals.widgetState ?? null;
  const statePersistence = initialGlobals.statePersistence ?? &quot;none&quot;;
  let nextStateRequestId = 0;
  /** @type {Map&lt;number, { resolve: () =&gt; void; reject: (error: Error) =&gt; void; timeout: ReturnType&lt;typeof globalThis.setTimeout&gt;; serializedState: string }&gt;} */
  const pendingStateWrites = new Map();
  const persistenceError = () =&gt;
    Object.assign(
      new Error(&quot;The host could not persist the widget state update&quot;),
      {
        code: -32000,
        data: { code: &quot;widget_state_persistence_failed&quot;, retryable: false },
      },
    );
  /**
   * @param {object} prototype
   * @param {string} property
   */
  const getPrototypeGetter = (prototype, property) =&gt; {
    // oxlint-disable-next-line typescript/unbound-method -- invoked through captured Reflect.apply
    const getter = Object.getOwnPropertyDescriptor(prototype, property)?.get;
    if (getter == null) {
      throw new Error(`Missing ${property} getter`);
    }
    return getter;
  };
  const getMessageData = getPrototypeGetter(MessageEvent.prototype, &quot;data&quot;);
  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, &quot;ports&quot;);
  const getMessageSource = getPrototypeGetter(MessageEvent.prototype, &quot;source&quot;);
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const addHostMessageListener = MessagePort.prototype.addEventListener;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const postHostMessage = MessagePort.prototype.postMessage;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const startHostPort = MessagePort.prototype.start;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const stopMessagePropagation = Event.prototype.stopImmediatePropagation;
  /** @type {MessagePort | null} */
  let hostPort = null;
  const postToHost = (type, payload) =&gt; {
    if (hostPort != null) {
      apply(postHostMessage, hostPort, [{ type, ...payload }]);
    }
  };
  const openExternal = ({ href }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;open-external&quot;, { href });
    }
  };
  const sendFollowUpMessage = ({ context, prompt, title }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;follow-up&quot;, { context, prompt, title });
    }
    return Promise.resolve();
  };
  /**
   * @param {Record&lt;string, unknown&gt; | ((previous: Record&lt;string, unknown&gt; | null) =&gt; Record&lt;string, unknown&gt;)} next
   * @returns {Promise&lt;void&gt;}
   */
  const setWidgetState = async (next) =&gt; {
    const nextState = typeof next === &quot;function&quot; ? next(state) : next;
    if (
      nextState == null ||
      typeof nextState !== &quot;object&quot; ||
      isArray(nextState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const inputState = stringify(
      nextState,
      (_key, /** @type {unknown} */ value) =&gt; {
        if (
          typeof value === &quot;undefined&quot; ||
          typeof value === &quot;function&quot; ||
          typeof value === &quot;symbol&quot; ||
          (typeof value === &quot;number&quot; &amp;&amp; !Number.isFinite(value))
        ) {
          throw new TypeError(&quot;Widget state must be a JSON object&quot;);
        }
        return value;
      },
    );
    const parsedState = parse(inputState);
    if (
      parsedState == null ||
      typeof parsedState !== &quot;object&quot; ||
      isArray(parsedState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const storedState = {
      modelContent: null,
      privateContent: null,
      ...parsedState,
    };
    const serializedState = stringify(storedState);
    if (encode(serializedState).length &gt; 16 * 1024) {
      throw new TypeError(
        &quot;Widget state must be a JSON object of at most 16 KiB&quot;,
      );
    }
    if (
      hasOwn(storedState, &quot;imageIds&quot;) &amp;&amp;
      (!isArray(storedState.imageIds) ||
        storedState.imageIds.some(
          (/** @type {unknown} */ id) =&gt; typeof id !== &quot;string&quot;,
        ))
    ) {
      throw new TypeError(&quot;Widget state imageIds must be an array of strings&quot;);
    }
    if (storedState.imageIds?.length &gt; 0) {
      throw Object.assign(
        new TypeError(&quot;Visualization state does not support image attachments&quot;),
        { code: -32602, data: { code: &quot;images_unsupported&quot; } },
      );
    }
    state = storedState;
    globalThis.openai.widgetState = state;
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: { widgetState: state } },
      }),
    );
    if (statePersistence === &quot;none&quot;) {
      throw persistenceError();
    }
    const id = ++nextStateRequestId;
    return new Promise((resolve, reject) =&gt; {
      const timeout = globalThis.setTimeout(() =&gt; {
        pendingStateWrites.delete(id);
        reject(persistenceError());
      }, 30_000);
      pendingStateWrites.set(id, { resolve, reject, timeout, serializedState });
      postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
    });
  };
  const mockElement = document.getElementById(&quot;codex-connector-mocks&quot;);
  const connectorGlobals = {};
  if (mockElement != null) {
    const values = new Map(Object.entries(parse(mockElement.textContent)));
    mockElement.remove();
    connectorGlobals.visualizationData = {
      updates: Array.from(values, ([name, value]) =&gt; ({
        name,
        revision: 1,
        state: &quot;ready&quot;,
        value: { type: &quot;json&quot;, value },
      })),
    };
    connectorGlobals.visualization = {
      /** @param {string} name @param {(value: unknown) =&gt; void} callback */
      onData(name, callback) {
        if (typeof callback !== &quot;function&quot;) {
          throw new TypeError(&quot;onData requires a callback&quot;);
        }
        try {
          callback(values.get(name));
        } catch (error) {
          // oxlint-disable-next-line no-console -- Keep authored callback failures local.
          console.error(&quot;Live visualization data callback failed&quot;, error);
        }
        // A static preview delivers the current fixture once per subscription.
        return () =&gt; {};
      },
    };
  }
  const syncTheme = () =&gt; {
    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      ...connectorGlobals,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},
      visualizationTheme: theme,
      widgetState: state,
      statePersistence,
      stateModelContext: &quot;none&quot;,
    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: globalThis.openai },
      }),
    );
  };
  const sendHeight = () =&gt; {
    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              sendHeight();
            } else if (
              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {
              /** @type {unknown} */
              const id = data.id;
              if (typeof id !== &quot;number&quot;) {
                return;
              }
              const pending = pendingStateWrites.get(id);
              if (pending != null) {
                pendingStateWrites.delete(id);
                globalThis.clearTimeout(pending.timeout);
                if (data.ok === true) {
                  pending.resolve();
                } else {
                  pending.reject(persistenceError());
                }
              }
            }
          },
        ]);
        apply(startHostPort, nextHostPort, []);
      } catch {
        return;
      }
      hostPort = nextHostPort;
      for (const [id, { serializedState }] of pendingStateWrites) {
        postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
      }
      sendHeight();
    },
    { capture: true },
  );
  document.currentScript?.remove();
  mediaQuery.addEventListener(&quot;change&quot;, syncTheme);
  globalThis.addEventListener(&quot;click&quot;, (event) =&gt; {
    if (event.defaultPrevented) {
      return;
    }
    let element = null;
    if (event.target instanceof globalThis.Element) {
      element = event.target;
    } else if (event.target instanceof globalThis.Node) {
      element = event.target.parentElement;
    }
    const link = element?.closest(&quot;a[href]&quot;);
    const href = link?.getAttribute(&quot;href&quot;);
    if (href == null) {
      return;
    }
    if (href.startsWith(&quot;#&quot;)) {
      let id;
      try {
        id = decodeURIComponent(href.slice(1));
      } catch {
        return;
      }
      const target = id.length === 0 ? root : document.getElementById(id);
      if (
        target == null ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      event.preventDefault();
      postToHost(&quot;scroll-to&quot;, {
        top: target.getBoundingClientRect().top + globalThis.scrollY,
      });
      return;
    }
    event.preventDefault();
    openExternal({ href });
  });
  new ResizeObserver(sendHeight).observe(document.body);
  syncTheme();
})();

&lt;script id=&quot;flow-payload&quot; type=&quot;application/json&quot;&gt;{&quot;checkpoint&quot;: &quot;industry-33m-continue/best.pt&quot;, &quot;config&quot;: {&quot;vocab_size&quot;: 8192, &quot;d_model&quot;: 512, &quot;num_layers&quot;: 8, &quot;num_heads&quot;: 8, &quot;dropout&quot;: 0.1, &quot;context_length&quot;: 256, &quot;pad_id&quot;: 0, &quot;norm_style&quot;: &quot;pre&quot;, &quot;norm_type&quot;: &quot;rms&quot;, &quot;position_encoding&quot;: &quot;rope&quot;, &quot;ffn_type&quot;: &quot;swiglu&quot;}, &quot;text&quot;: &quot;现在,人工智能大约是唯一一个,能够让国内三大互联网巨头BAT同时上线一争高下的领域. 2017年,BAT全面高调入局AI.百度说要\&quot;All in AI\&quot;,腾讯则强调\&quot;AI in All\&quot;.马云年初启动了NASA计划,下半年再次决定千亿投入达摩院,阿里云开始布局\&quot;产业AI\&quot;.在此之前,移动互联网的半壁江山,都被BAT所占领.而如今,\&quot;人工智能\&quot;正在成为BAT新的主要投资标的. 如果说之前对人工智能的投入还只是试水,那么从现在开始,战争的硝烟已经可见.新一局的\&quot;三国杀\&quot;,正在BAT中开展.它们为自己所规划的战略和扮演的角色,也逐渐露出了端倪. 逐鹿下一个时代 马云说:\&quot;阿里巴巴必须是一家创造未来的公司.\&quot;实际上,不止阿里,公司做到BAT这个量级,它们所思考的,也都更多的是如何下注新一个时代.而现在,它们都纷纷把宝押在了人工智能之上. 第四届世界互联网大会上,李彦宏就说:\&quot;去年我讲,移动互联网时代已经结束,下一幕是人工智能.当时很多人不同意,他们说只是进入了移动互联网的下半场.今年,之前讲下半场的人,都开始讲人工智能了.\&quot;话里话外,李彦宏有按捺不住的得意. 人工智能技术,已然成为移动互联网之后不能忽略的桥头堡.互联网时代的真谛是流量.搜索之于百度,电商之于阿里,社交之于腾讯,殊途同归的是,在那个年头,谁抢占的流量越多,谁就能占山为王. 从PC时期到移动互联网时期,流量争夺的本质虽然尚在,但流量的载体已经发生了变化,移动端的信息交互方式,发生了不同以往的变革. 在一年多以前,百度曾经被很多人目之为\&quot;掉队\&quot;了.甚至有不少人提出,BAT将被\&quot;TMD\&quot;所取代.那是因为,在移动互联网上,百度在搜索引擎方面的优势,随着浏览器和桌面在移动端的改变而被削弱,滴滴,美团点评等应用接替了垂直消费场景中的搜索,而颠覆了传统媒体广告市场的,则是今日头条. 但是,移动时代也带来了数据的爆发.线上积淀的海量数据的处理,清洗,分析,管理,对传统的软件,存储,计算资源等,都是巨大挑战,也是巨大机会. 人工智能已经是第三次浪潮.现在的AI技术,还远无法到达我们对强人工智能的想象,也没有形成当年移动互联网启动的商业市场. 据BBC预测,2020年,全球AI市场规模,将达到1190亿元人民币,这个数字,甚至还比不上两年前的国内移动互联网的产业规模.但是,在人力已经无法解决的海量数据的处理,挖掘,预测方面,机器开启了无数的想象力. 深度学习带来的这一波AI浪潮的\&quot;技术红利\&quot;,对于云计算,大数据,移动互联网,物联网而言,都是一次产业升级迭代的机会.当PC和移动互联网的流量红利要趋于消亡,产业需要更强大的服务引擎和动力. 美国的互联网巨头,无论是Google还是亚马逊,Facebook,在满足更多的2C用户基础上,也都在布局企业服务领域,以接入更广大企业客户需求.而其中,最主要的未来技术,就是人工智能. 在这个变革时代前奏响起的时刻,没有一个巨头,愿意放弃这个筹码.经过几年积累,BAT的人工智能战略和业务领域已经渐渐清晰,而它们的布局,也对众多关键领域产生了巨大影响. 三足鼎立 1,百度:ALL in AI的中国版Google? 2017年,在不到半年的时间里市值上涨了300多亿美元,依靠人工智能技术和信息流广告,百度俨然复苏. 百度以搜索引擎起家,搜索重算法.因此,百度也成为在人工智能领域最早布局,也最早在深度学习上加以应用的公司. 从PC时代依靠搜索引擎建立了江湖地位的百度,也曾在移动互联网时代尝试更多的业务.但在不断试错后,百度最终还是选择了回归技术. 2017年初,李彦宏在新年公开信中表示,人工智能和内容分发,将成为百度新的战略重点.这一年,虽然有首席科学家吴恩达,高级副总裁王劲等的离职,但是百度迎来了微软前全球执行副总裁陆奇的加盟,担任总裁和COO. 陆奇的加入,也推动了百度向开放,生态的路子上走去.百度进行了组织架构调整,剥离外卖等O2O业务,在搜索之外,全面向一家技术平台公司转型. 围绕着底层技术,百度走向应用场景落地.百度将DuerOS比喻为AI时代的安卓操作系统,将语音作为入口,切入家居,可穿戴,手机,车载等场景.而Apollo则可以说是自动驾驶领域的安卓.搜索引擎先天的AI基因赋予了百度优势,依靠数据和算法基础,拓展到实践领域,百度就能打通进入更多产业的关卡. 提到安卓,这不得不令人联想到Google.2018年CES开幕之前,陆奇在拉斯维加斯说:\&quot;百度就是中国版的Google.\&quot; 在Google的开放生态下,Google Assistant已经覆盖了超过1亿台设备,接入了越来越多的终端,提供庞大的数据,将其培养成不断强大的AI服务平台.而在自动驾驶平台的开放上,百度已经走在了Google的前面. 2,阿里:云+ET大脑,真正的商业服务 面对去年围棋世界冠军柯洁败于AlphaGo的消息,\&quot;文科生\&quot;马云说:\&quot;So what?\&quot; 但这并不意味着马云不关注人工智能,实际上,他强调的是物联网和\&quot;机器智能\&quot;.和马云一贯的商业精神一脉相承,阿里的AI策略,无论是做什么,都要先确认商业落点. 阿里没有百度的底层技术实力,但是阿里基于电商平台,在大数据上早早就押了宝.早在9年前,阿里开始开拓云计算领域;如今,阿里云平台的服务已经覆盖了全球200多个国家和地区.在3年前,马云就说:人类正从IT时代走向DT时代. 云计算+大数据,再加上AI技术的福能,阿里云从人工智能ET进化到如今的ET大脑,在城市大脑,医疗大脑,工业大脑等领域,将阿里的计算能力和数据处理能力输出到零售,金融,医疗,交通等行业. 今年3月,阿里启动NASA计划.今年4月,阿里面向开发者的AliGenie语音开放平台推出,同时亮相的,还有阿里的智能家居硬件天猫精灵音箱.10月,阿里宣布成立达摩院,计划三年内投入千亿元,对量子计算,基础算法,网络安全等领域进行研发. (阿里宣布成立达摩院) 另外一个电商帝国亚马逊,正围绕自己的电商业务,云服务AWS以及语音平台Alexa,智能音箱Echo等,建立了独特的商业生态.而同样作为电商和云计算巨头,阿里的野心已然表露无遗. 腾讯:AI in All,沿着场景应用技术 腾讯在人工智能领域的起步,仿佛比百度和阿里慢了一拍.在项目上,腾讯也更偏向于技术实验,例如在日本UEC杯夺冠的围棋AI\&quot;绝艺\&quot;. 马化腾说:\&quot;如果没有场景落地,业务没办法往下走.\&quot;腾讯的人工智能技术,也围绕着自带的应用展开.比如腾讯对微信朋友圈和QQ空间上十亿的人脸照片,利用人脸图片识别技术进行了研究,包括一些后台的定向技术,数据分析,广告和内容服务,金融服务等,也都用上了人工智能技术,但大都在后端. 2016年,腾讯开设了人工智能实验室AI Lab,属于腾讯技术工程事业群,聚焦计算机视觉,语音识别,自然语言处理和机器学习等基础研究,并在2017年邀请前百度研究院副院长张潼加盟,担任AI Lab 主任.据张潼曾向黑智透露,AI Lab根据腾讯业务,主要针对游戏,内容,社交,搜索及工具平台型AI等应用方向. 腾讯在AI的布局上,主要以自身业务为驱动,具备极强的目的性.现在,腾讯的AI技术也走向开放.去年11月,腾讯公布了自己的AI战略 - - \&quot;AI in all\&quot;,把腾讯的AI技术开放出来,和行业结合,主要落地内容,游戏,医疗,零售,金融,安防,翻译,社交八大场景. 2017年,腾讯发布了AI医疗影像系统\&quot;觅影\&quot;,对食道癌等病症进行早期筛查和诊断;同年腾讯还推出了语音助手\&quot;叮当\&quot;和智能语音平台\&quot;腾讯云小微\&quot;. BAT的AI战略各不相同,但是在相关产业领域,它们已经展开了碰撞.而诸如智能家居,汽车,医疗等行业,在BAT的\&quot;入侵\&quot;下,产业格局也悄然发生了改变. BAT在哪些领域\&quot;相杀\&quot;? 1,语音:共同的物联网时代\&quot;卡位\&quot;梦想 2017年,国内的互联网巨头纷纷锁定了智能语音市场. 去年7月5日,百度宣称,要让开放的DuerOS成为回到时代巅峰的关键;就在同一天,阿里的智能音箱天猫精灵和中文人机交流系统AliGenie面世.彼时,腾讯叮当推出两个月,云小微刚刚问世一个月. 语音作为被寄予厚望的下一代核心的入口级产品,亚马逊Echo点燃了海内外几乎所有科技巨头的热情.BAT不约而同地,从类似亚马逊Alexa的平台入手开始切入. 作为互联网时代大厂,它们更理解\&quot;开放\&quot;的意义:在系统级层面开源,承载更多的服务和硬件合作伙伴,链接起更多的终端,为实现\&quot;万物互联\&quot;场景,建立新的生态平台. 百度度秘事业部总经理景鲲说,在百度眼中,DuerOS就是\&quot;人工智能时代的安卓\&quot;.它的目的,就是让每个开发者,能够以低门槛迅速打造属于自己的智能语音交互设备. 为了构建起生态,百度收购了创业公司KITT.AI以获取技术,成为业界少有的软硬件一体的解决方案.通过开源的技术,开发者可以实现不同场景的应用,即使是海外的设备,也能够通过接入DuerOS轻松入华.同时,百度也推出了搭载DuerOS2.0的智能硬件渡鸦raven H等. (百度智能硬件渡鸦raven H) 阿里的天猫精灵和Echo一样,在音乐播放之外,还可实现智能家居控制,语音购物,手机充值,叫外卖,充话费等功能.它内置了AliGenie语音助手和开发者平台,通过它开发者可以链接到阿里生态体系中的消费者和生活,商业场景. 今年1月,阿里AI Lab发布了智联网开放连接协议IoTConnect,让智能设备能够实现连接,自动组网,自动适配和支持天猫精灵的语音控制. 阿里或许没有百度在智能语音交互上深厚的技术积累,但在这个平台上,阿里更强调的,是产品未来所能提供的服务能力.阿里的优势是,和亚马逊一样,具备独特的商业生态,产品自带商业场景. \&quot;腾讯叮当\&quot;也出现在了今年的CES上.腾讯的内部产品研发的\&quot;多线并行\&quot;的习惯,让产品的定位和差异还不是非常清晰.但是,布局智能语音,收集更多的数据,辅助自己在智能家居,车载,智慧城市方面提供助力,是BAT共同的\&quot;物联网\&quot;时代平台梦想. 2,智能出行:车内圈地 汽车产业正迎来新一波革命,而BAT,正在对其进行全面的\&quot;入侵\&quot;. 去年10月,阿里和上汽合资的斑马网络推出了升级为2.0版本的斑马智行系统,并和神龙汽车合作,首款搭载了AliOS的智能汽车将落地东风雪铁龙.11月,李彦宏宣布百度的无人驾驶小巴车将在2018年实现小规模量产和试运营;同时,DuerOS车载版独立,推出Apollo小度车载系统.11月8日,腾讯在全球合作伙伴大会上,推出了车联\&quot;AI in Car\&quot;系统,开放腾讯基于AI的链接能力和生态资源. BAT和整车厂商的关系也变得紧密.\&quot;北上广\&quot;三大车厂,分别成为了它们的盟友:阿里和上汽的合作由来已久;2017年9月,腾讯和广汽签署在车联网,智能驾驶等领域合作的框架协议;10月,百度和北汽签署合作协议.当前国内的新能源汽车制造创业公司中,BAT也全部到位:百度和腾讯投资了蔚来汽车和威马汽车,阿里则入局了小鹏汽车. 除此之外,BAT的\&quot;圈地运动\&quot;中,还曾包括智能后视镜,车载盒子等各类产品. 汽车产业正处于向电动化和智能化转型升级的窗口期,智能化趋势,已经势不可挡.这个巨大的市场,没有人想错过,BAT也不例外,尽管姿势各不相同. 自动驾驶领域,百度无疑是走得最远的公司.李彦宏乘坐百度自家的自动驾驶汽车上了北京的五环,不仅引发了热烈讨论,还收获了国内无人驾驶领域的第一张交通罚单. 2017年底,百度的自动驾驶车队雄赳赳地开上了雄安新区的街头.百度的Apollo自动驾驶平台日前公布了2.0版本,Apollo合作伙伴规模突破90家. 按照陆奇的说法,Apollo就是自动驾驶领域的安卓系统,但会更加开放.Apollo平台和小度车载系统,将向未来的车厂提供更开放的软件平台和车载操作系统,让它们可以快速搭建自己的自动驾驶系统. 阿里CEO张勇曾经说过,阿里\&quot;不会做无人驾驶\&quot;.但阿里打造车载操作系统方面的动作,却一直都在进行. 2014年,阿里就上汽达成了战略合作,共同打造互联网汽车.2015年,阿里还曾和中国兵器工业集团共同成立了千寻位置网络有限公司.斑马智行系统中,可以绑定支付宝缴费,还引入了旅游路线引导,打包销售酒店和门票 t;: [{&quot;prompt&quot;: &quot;人工智能&quot;, &quot;text&quot;: &quot;人工智能,人工智能,人工智能,人工智能,人工智能,人工智能,人工智能,人工智能,人工智能,人工智能,人工智能,人工智能,人工智能,人工智能,人工智能,人工智能,人工智能&quot;, &quot;top5&quot;: [{&quot;text&quot;: &quot;,&quot;, &quot;id&quot;: 14, &quot;probability&quot;: 0.029224496334791183}, {&quot;text&quot;: &quot;人工智能&quot;, &quot;id&quot;: 338, &quot;probability&quot;: 0.01539115235209465}, {&quot;text&quot;: &quot;月&quot;, &quot;id&quot;: 933, &quot;probability&quot;: 0.009137587621808052}, {&quot;text&quot;: &quot;:&quot;, &quot;id&quot;: 28, &quot;probability&quot;: 0.009115973487496376}, {&quot;text&quot;: &quot;\&quot;&quot;, &quot;id&quot;: 4, &quot;probability&quot;: 0.007865671068429947}]}, {&quot;prompt&quot;: &quot;机器学习的主要方法&quot;, &quot;text&quot;: &quot;机器学习的主要方法,在,在,在,在,在,在,在,在,在,在,在,在,在,在,在,在&quot;, &quot;top5&quot;: [{&quot;text&quot;: &quot;,&quot;, &quot;id&quot;: 14, &quot;probability&quot;: 0.03988347202539444}, {&quot;text&quot;: &quot; &quot;, &quot;id&quot;: 223, &quot;probability&quot;: 0.01209957618266344}, {&quot;text&quot;: &quot;人工智能&quot;, &quot;id&quot;: 338, &quot;probability&quot;: 0.012085679918527603}, {&quot;text&quot;: &quot;\&quot;&quot;, &quot;id&quot;: 4, &quot;probability&quot;: 0.010226694867014885}, {&quot;text&quot;: &quot;在&quot;, &quot;id&quot;: 291, &quot;probability&quot;: 0.009955808520317078}]}, {&quot;prompt&quot;: &quot;数据&quot;, &quot;text&quot;: &quot;数据,在,人工智能,在,在,在,在,在人工智能,在,在,人工智能,人工智能,人工智能,在,在,在,&quot;, &quot;top5&quot;: [{&quot;text&quot;: &quot;,&quot;, &quot;id&quot;: 14, &quot;probability&quot;: 0.03667862340807915}, {&quot;text&quot;: &quot;人工智能&quot;, &quot;id&quot;: 338, &quot;probability&quot;: 0.012535753659904003}, {&quot;text&quot;: &quot;在&quot;, &quot;id&quot;: 291, &quot;probability&quot;: 0.009882280603051186}, {&quot;text&quot;: &quot;\&quot;&quot;, &quot;id&quot;: 4, &quot;probability&quot;: 0.009847017005085945}, {&quot;text&quot;: &quot; &quot;, &quot;id&quot;: 223, &quot;probability&quot;: 0.009452109225094318}]}, {&quot;prompt&quot;: &quot;深度学习是一种&quot;, &quot;text&quot;: &quot;深度学习是一种,在在,在,在,在,在,在人工智能,在,在,在,在,在,在,在,在,在&quot;, &quot;top5&quot;: [{&quot;text&quot;: &quot;,&quot;, &quot;id&quot;: 14, &quot;probability&quot;: 0.04036935791373253}, {&quot;text&quot;: &quot;人工智能&quot;, &quot;id&quot;: 338, &quot;probability&quot;: 0.012918035499751568}, {&quot;text&quot;: &quot;:&quot;, &quot;id&quot;: 28, &quot;probability&quot;: 0.01012410968542099}, {&quot;text&quot;: &quot;\&quot;&quot;, &quot;id&quot;: 4, &quot;probability&quot;: 0.009653575718402863}, {&quot;text&quot;: &quot; &quot;, &quot;id&quot;: 223, &quot;probability&quot;: 0.009060562588274479}]}], &quot;raw&quot;: {&quot;text&quot;: &quot;现在,人工智能大约是唯一一个,能够让国内三大互联网巨头BAT同时上线一争高下的领域.\n  2017年,BAT全面高调入局AI.百度说要\&quot;All in AI\&quot;,腾讯则强调\&quot;AI in All\&quot;.马云年初启动了NASA计划,下半年再次决定千亿投入达摩院,阿里云开始布局\&quot;产业AI\&quot;.在此之前,移动互联网的半壁江山,都被BAT所占领.而如今,\&quot;人工智能\&quot;正在成为BAT新的主要投资标的.\n  如果说之前对人工智能的投入还只是试水,那么从现在开始,战争的硝烟已经可见.新一局的\&quot;三国杀\&quot;,正在BAT中开展.它们为自己所规划的战略和扮演的角色,也逐渐露出了端倪.\n  逐鹿下一个时代\n  马云说:\&quot;阿里巴巴必须是一家创造未来的公司.\&quot;实际上,不止阿里,公司做到BAT这个量级,它们所思考的,也都更多的是如何下注新一个时代.而现在,它们都纷纷把宝押在了人工智能之上.\n  第四届世界互联网大会上,李彦宏就说:\&quot;去年我讲,移动互联网时代已经结束,下一幕是人工智能.当时很多人不同意,他们说只是进入了移动互联网的下半场.今年,之前讲下半场的人,都开始讲人工智能了.\&quot;话里话外,李彦宏有按捺不住的得意.  人工智能技术,已然成为移动互联网之后不能忽略的桥头堡.互联网时代的真谛是流量.搜索之于百度,电商之于阿里,社交之于腾讯,殊途同归的是,在那个年头,谁抢占的流量越多,谁就能占山为王.\n  从PC时期到移动互联网时期,流量争夺的本质虽然尚在,但流量的载体已经发生了变化,移动端的信息交互方式,发生了不同以往的变革.\n  在一年多以前,百度曾经被很多人目之为\&quot;掉队\&quot;了.甚至有不少人提出,BAT将被\&quot;TMD\&quot;所取代.那是因为,在移动互联网上,百度在搜索引擎方面的优势,随着浏览器和桌面在移动端的改变而被削弱,滴滴,美团点评等应用接替了垂直消费场景中的搜索,而颠覆了传统媒体广告市场的,则是今日头条.\n  但是,移动时代也带来了数据的爆发.线上积淀的海量数据的处理,清洗,分析,管理,对传统的软件,存储,计算资源等,都是巨大挑战,也是巨大机会.\n  人工智能已经是第三次浪潮.现在的AI技术,还远无法到达我们对强人工智能的想象,也没有形成当年移动互联网启动的商业市场.\n  据BBC预测,2020年,全球AI市场规模,将达到1190亿元人民币,这个数字,甚至还比不上两年前的国内移动互联网的产业规模.但是,在人力已经无法解决的海量数据的处理,挖掘,预测方面,机器开启了无数的想象力.\n  深度学习带来的这一波AI浪潮的\&quot;技术红利\&quot;,对于云计算,大数据,移动互联网,物联网而言,都是一次产业升级迭代的机会.当PC和移动互联网的流量红利要趋于消亡,产业需要更强大的服务引擎和动力.\n  美国的互联网巨头,无论是Google还是亚马逊,Facebook,在满足更多的2C用户基础上,也都在布局企业服务领域,以接入更广大企业客户需求.而其中,最主要的未来技术,就是人工智能.\n  在这个变革时代前奏响起的时刻,没有一个巨头,愿意放弃这个筹码.经过几年积累,BAT的人工智能战略和业务领域已经渐渐清晰,而它们的布局,也对众多关键领域产生了巨大影响.\n  三足鼎立\n  1,百度:ALL in AI的中国版Google?\n  2017年,在不到半年的时间里市值上涨了300多亿美元,依靠人工智能技术和信息流广告,百度俨然复苏.\n  百度以搜索引擎起家,搜索重算法.因此,百度也成为在人工智能领域最早布局,也最早在深度学习上加以应用的公司.\n  从PC时代依靠搜索引擎建立了江湖地位的百度,也曾在移动互联网时代尝试更多的业务.但在不断试错后,百度最终还是选择了回归技术.\n  2017年初,李彦宏在新年公开信中表示,人工智能和内容分发,将成为百度新的战略重点.这一年,虽然有首席科学家吴恩达,高级副总裁王劲等的离职,但是百度迎来了微软前全球执行副总裁陆奇的加盟,担任总裁和COO.\n  陆奇的加入,也推动了百度向开放,生态的路子上走去.百度进行了组织架构调整,剥离外卖等O2O业务,在搜索之外,全面向一家技术平台公司转型.\n  围绕着底层技术,百度走向应用场景落地.百度将DuerOS比喻为AI时代的安卓操作系统,将语音作为入口,切入家居,可穿戴,手机,车载等场景.而Apollo则可以说是自动驾驶领域的安卓.搜索引擎先天的AI基因赋予了百度优势,依靠数据和算法基础,拓展到实践领域,百度就能打通进入更多产业的关卡.\n  提到安卓,这不得不令人联想到Google.2018年CES开幕之前,陆奇在拉斯维加斯说:\&quot;百度就是中国版的Google.\&quot;\n  在Google的开放生态下,Google Assistant已经覆盖了超过1亿台设备,接入了越来越多的终端,提供庞大的数据,将其培养成不断强大的AI服务平台.而在自动驾驶平台的开放上,百度已经走在了Google的前面.\n  2,阿里:云+ET大脑,真正的商业服务\n  面对去年围棋世界冠军柯洁败于AlphaGo的消息,\&quot;文科生\&quot;马云说:\&quot;So what?\&quot;\n  但这并不意味着马云不关注人工智能,实际上,他强调的是物联网和\&quot;机器智能\&quot;.和马云一贯的商业精神一脉相承,阿里的AI策略,无论是做什么,都要先确认商业落点.\n  阿里没有百度的底层技术实力,但是阿里基于电商平台,在大数据上早早就押了宝.早在9年前,阿里开始开拓云计算领域;如今,阿里云平台的服务已经覆盖了全球200多个国家和地区.在3年前,马云就说:人类正从IT时代走向DT时代.\n  云计算+大数据,再加上AI技术的福能,阿里云从人工智能ET进化到如今的ET大脑,在城市大脑,医疗大脑,工业大脑等领域,将阿里的计算能力和数据处理能力输出到零售,金融,医疗,交通等行业.\n  今年3月,阿里启动NASA计划.今年4月,阿里面向开发者的AliGenie语音开放平台推出,同时亮相的,还有阿里的智能家居硬件天猫精灵音箱.10月,阿里宣布成立达摩院,计划三年内投入千亿元,对量子计算,基础算法,网络安全等领域进行研发.\n(阿里宣布成立达摩院)  另外一个电商帝国亚马逊,正围绕自己的电商业务,云服务AWS以及语音平台Alexa,智能音箱Echo等,建立了独特的商业生态.而同样作为电商和云计算巨头,阿里的野心已然表露无遗.\n  腾讯:AI in All,沿着场景应用技术\n  腾讯在人工智能领域的起步,仿佛比百度和阿里慢了一拍.在项目上,腾讯也更偏向于技术实验,例如在日本UEC杯夺冠的围棋AI\&quot;绝艺\&quot;.\n  马化腾说:\&quot;如果没有场景落地,业务没办法往下走.\&quot;腾讯的人工智能技术,也围绕着自带的应用展开.比如腾讯对微信朋友圈和QQ空间上十亿的人脸照片,利用人脸图片识别技术进行了研究,包括一些后台的定向技术,数据分析,广告和内容服务,金融服务等,也都用上了人工智能技术,但大都在后端.\n  2016年,腾讯开设了人工智能实验室AI Lab,属于腾讯技术工程事业群,聚焦计算机视觉,语音识别,自然语言处理和机器学习等基础研究,并在2017年邀请前百度研究院副院长张潼加盟,担任AI Lab 主任.据张潼曾向黑智透露,AI Lab根据腾讯业务,主要针对游戏,内容,社交,搜索及工具平台型AI等应用方向.  腾讯在AI的布局上,主要以自身业务为驱动,具备极强的目的性.现在,腾讯的AI技术也走向开放.去年11月,腾讯公布了自己的AI战略 -  - \&quot;AI in all\&quot;,把腾讯的AI技术开放出来,和行业结合,主要落地内容,游戏,医疗,零售,金融,安防,翻译,社交八大场景.\n  2017年,腾讯发布了AI医疗影像系统\&quot;觅影\&quot;,对食道癌等病症进行早期筛查和诊断;同年腾讯还推出了语音助手\&quot;叮当\&quot;和智能语音平台\&quot;腾讯云小微\&quot;.\n  BAT的AI战略各不相同,但是在相关产业领域,它们已经展开了碰撞.而诸如智能家居,汽车,医疗等行业,在BAT的\&quot;入侵\&quot;下,产业格局也悄然发生了改变.\n  BAT在哪些领域\&quot;相杀\&quot;?\n  1,语音:共同的物联网时代\&quot;卡位\&quot;梦想\n  2017年,国内的互联网巨头纷纷锁定了智能语音市场.\n  去年7月5日,百度宣称,要让开放的DuerOS成为回到时代巅峰的关键;就在同一天,阿里的智能音箱天猫精灵和中文人机交流系统AliGenie面世.彼时,腾讯叮当推出两个月,云小微刚刚问世一个月.\n  语音作为被寄予厚望的下一代核心的入口级产品,亚马逊Echo点燃了海内外几乎所有科技巨头的热情.BAT不约而同地,从类似亚马逊Alexa的平台入手开始切入.\n  作为互联网时代大厂,它们更理解\&quot;开放\&quot;的意义:在系统级层面开源,承载更多的服务和硬件合作伙伴,链接起更多的终端,为实现\&quot;万物互联\&quot;场景,建立新的生态平台.\n  百度度秘事业部总经理景鲲说,在百度眼中,DuerOS就是\&quot;人工智能时代的安卓\&quot;.它的目的,就是让每个开发者,能够以低门槛迅速打造属于自己的智能语音交互设备.\n  为了构建起生态,百度收购了创业公司KITT.AI以获取技术,成为业界少有的软硬件一体的解决方案.通过开源的技术,开发者可以实现不同场景的应用,即使是海外的设备,也能够通过接入DuerOS轻松入华.同时,百度也推出了搭载DuerOS2.0的智能硬件渡鸦raven H等.\n(百度智能硬件渡鸦raven H)  阿里的天猫精灵和Echo一样,在音乐播放之外,还可实现智能家居控制,语音购物,手机充值,叫外卖,充话费等功能.它内置了AliGenie语音助手和开发者平台,通过它开发者可以链接到阿里生态体系中的消费者和生活,商业场景.\n  今年1月,阿里AI Lab发布了智联网开放连接协议IoTConnect,让智能设备能够实现连接,自动组网,自动适配和支持天猫精灵的语音控制.\n  阿里或许没有百度在智能语音交互上深厚的技术积累,但在这个平台上,阿里更强调的,是产品未来所能提供的服务能力.阿里的优势是,和亚马逊一样,具备独特的商业生态,产品自带商业场景.\n  \&quot;腾讯叮当\&quot;也出现在了今年的CES上.腾讯的内部产品研发的\&quot;多线并行\&quot;的习惯,让产品的定位和差异还不是非常清晰.但是,布局智能语音,收集更多的数据,辅助自己在智能家居,车载,智慧城市方面提供助力,是BAT共同的\&quot;物联网\&quot;时代平台梦想.\n  2,智能出行:车内圈地\n  汽车产业正迎来新一波革命,而BAT,正在对其进行全面的\&quot;入侵\&quot;.\n  去年10月,阿里和上汽合资的斑马网络推出了升级为2.0版本的斑马智行系统,并和神龙汽车合作,首款搭载了AliOS的智能汽车将落地东风雪铁龙.11月,李彦宏宣布百度的无人驾驶小巴车将在2018年实现小规模量产和试运营;同时,DuerOS车载版独立,推出Apollo小度车载系统.11月8日,腾讯在全球合作伙伴大会上,推出了车联\&quot;AI in Car\&quot;系统,开放腾讯基于AI的链接能力和生态资源.\n  BAT和整车厂商的关系也变得紧密.\&quot;北上广\&quot;三大车厂,分别成为了它们的盟友:阿里和上汽的合作由来已久;2017年9月,腾讯和广汽签署在车联网,智能驾驶等领域合作的框架协议;10月,百度和北汽签署合作协议.当前国内的新能源汽车制造创业公司中,BAT也全部到位:百度和腾讯投资了蔚来汽车和威马汽车,阿里则入局了小鹏汽车.\n  除此之外,BAT的\&quot;圈地运动\&quot;中,还曾包括智能后视镜,车载盒子等各类产品.\n  汽车产业正处于向电动化和智能化转型升级的窗口期,智能化趋势,已经势不可挡.这个巨大的市场,没有人想错过,BAT也不例外,尽管姿势各不相同.\n  自动驾驶领域,百度无疑是走得最远的公司.李彦宏乘坐百度自家的自动驾驶汽车上了北京的五环,不仅引发了热烈讨论,还收获了国内无人驾驶领域的第一张交通罚单.\n  2017年底,百度的自动驾驶车队雄赳赳地开上了雄安新区的街头.百度的Apollo自动驾驶平台日前公布了2.0版本,Apollo合作伙伴规模突破90家.\n  按照陆奇的说法,Apollo就是自动驾驶领域的安卓系统,但会更加开放.Apollo平台和小度车载系统,将向未来的车厂提供更开放的软件平台和车载操作系统,让它们可以快速搭建自己的自动驾驶系统.\n  阿里CEO张勇曾经说过,阿里\&quot;不会做无人驾驶\&quot;.但阿里打造车载操作系统方面的动作,却一直都在进行.\n  2014年,阿里就上汽达成了战略合作,共同打造互联网汽车.2015年,阿里还曾和中国兵器工业集团共同成立了千寻位置网络有限公司.斑马智行系统中,可以绑定支付宝缴费,还引入了旅游路线引导,打包销售酒店和门票预订等功能.阿里的车载操作系统,秉承了其一贯的\&quot;商业优先\&quot;的风格.\n  相比之下,腾讯的重点仍在于布局联合车企的投资上,其车载系统,也更多地是在车内场景,引入其擅长的内容和社交服务.其\&quot;AI in Car\&quot;系统仍然立足于腾讯的社交优势,基于腾讯研发的车联网安全体系,搭载后可以在车内安全接收QQ和微信的信息.\n  但BAT的入局,已经让整车厂,Tier1和车联网,车机厂商之间的供应关系,悄然产生了变化.汽车产业的价值链,或许也将重塑.\n  3,医疗:AI大脑,让技术的归技术\n  2017年,阿里云ET医疗大脑正式发布,进军医疗AI领域.阿里表示,ET医疗大脑,已经可以在患者虚拟助理,医学影像,精准医疗等领域承担医生助手的角色.\n  阿里云总裁胡晓明在年初曾对黑智表示,人工智能系统辅助医疗,并不是取代医生,ET医疗大脑将辅助医生诊断和分析结果,提高诊断速度,同时促进算法迭代.\n  这不由得让我们联想到百度近年来在医疗大脑上的投入.2016年10月,\&quot;百度医疗大脑\&quot;在北京发布,它是通过海量医疗数据,专业文献的采集与分析进行人工智能化的产品设计.\n  最初百度的医疗布局主要集中在医疗信息搜索,进而扩展到挂号预约等服务,在线问诊,送药电商等.去年2月,百度正式宣布将医疗业务的重点布局在人工智能领域,原百度医疗事业部业务关停.李彦宏对此给出的解释是:百度将会利用人工智能,继续参与医疗领域.比如智能挂号,智能诊疗,收集基因数据,制药研发等.\n  在社交和通信方面占优的腾讯,则更重视利用自己在社交方面的优势,从流量入口切入医疗市场.好大夫,微医,丁香园,医联,卓健等互联网医疗公司,以及医美O2O平台新氧,更美,均有腾讯的投资.腾讯正试图通过自身的大数据能力,以及产品平台上的用户触达能力,整合医疗分发平台,成为连接起医疗机构和患者之间的一级入口.\n  同时,腾讯也在加强\&quot;AI+医疗\&quot;的产品落地.去年8月,腾讯首款人工智能医疗影像产品\&quot;腾讯觅影\&quot;正式发布,并发起成立了AI医学影像联合实验室.目前,腾讯觅影已经从医疗影像应用扩展到AI辅助诊疗.\n  多年以来,BAT都没有放弃在互联网医疗的布局.但是,它们不得不面对的问题是,在这块领域,巨头们的相关产品却举步维艰.医疗领域和互联网的开放环境大不相同,资源的稀缺及垄断,政策的高监管性,数据的封闭,疾病市场的碎片化,都和BAT熟悉的领域大相径庭.\n  这次,大厂们选择了另外一条弯道超车:让技术的,归于技术.它们甩掉了医疗中劳动密集的相关环节,聚焦在技术本身,要用人工智能技术,提升医疗本身最核心的诊疗环节的能力.\n  在更多的产业中,BAT也正成为不可忽视的变量.\&quot;新零售\&quot;如火如荼时,在今年双十一,阿里的人工智能设计师\&quot;鲁班\&quot;生成了4亿个定制的横幅广告;淘宝的聊天机器人在预售期间每天回答350万个简单提问;阿里巴巴计算资源AI分配官\&quot;达灵\&quot;将数据中心资源分配率拉升到了90%以上.\n  百度正在试图开启一个\&quot;手机AI\&quot;时代.去年11 月百度宣布与小米在人工智能和物联网科技方面的合作关系后,12月,李彦宏又牵起了余承东的手.百度的AI技术将更多地在华为终端上落地,直接触达消费者.\n  陆奇说,\&quot;China+ AI\&quot;将释放更多的AI创新.这是一个时代的变革期,虽然是为不确定的未来\&quot;押宝\&quot;,但站在这个路口的,不仅是BAT,也包括所有的企业和资本.\n(责任编辑:DF207)&quot;, &quot;quality_score&quot;: 4.0703125}, &quot;source&quot;: {&quot;source&quot;: &quot;/U &lt;script&gt;
(()=&gt;{

  let state = null;
  try {
    const localStorage = globalThis.localStorage;
    const probeKey = `${storageKey}:probe`;
    localStorage.setItem(probeKey, "1");
    localStorage.removeItem(probeKey);
    storage = localStorage;
    const savedState = storage.getItem(storageKey);
    if (savedState != null) {
      try {
        state = parseState(savedState);
      } catch {
        // Invalid saved state does not disable future writes.
      }
    }
  } catch {
    storage = null;
  }
  const persistSize = () => {
    globalThis.clearTimeout(sizeWriteTimeout);
    if (pendingSize == null) {
      return;
    }
    try {
      storage?.setItem(sizeStorageKey, pendingSize);
    } catch {
      // A denied or full cache must not affect the visualization.
    }
    pendingSize = null;
  };
  if (isShare) {
    globalThis.addEventListener("pagehide", persistSize);
  }
  const initialGlobals = {
    widgetState: state,
    statePersistence: storage == null ? "none" : "local",
  };

  const channel = new MessageChannel();
  channel.port1.addEventListener("message", (event) => {
    const data = event.data;
    if (typeof data !== "object" || data == null) {
      return;
    }
    if (data.type === "widget-state-write") {
      if (!Number.isSafeInteger(data.id) || data.id <= 0) {
        return;
      }
      let ok = false;
      try {
        if (storage != null) {
          const state = parseState(data.state);
          storage.setItem(storageKey, JSON.stringify(state));
          ok = true;
        }
      } catch {
        // Storage denial, quota limits, and invalid state return a failed receipt.
      }
      channel.port1.postMessage({
        type: "widget-state-result",
        id: data.id,
        ok,
      });
      return;
    }
    if (data.type === "height") {
      const height = data.height;
      if (
        typeof height !== "number" ||
        !Number.isFinite(height) ||
        height < 0
      ) {
        return;
      }
      if (height <= 10_000) {
        const width = isShare && storage != null ? frame.clientWidth : null;
        frame.style.height = Math.ceil(height) + "px";
        if (isShare && storage != null) {
          const size = JSON.stringify({
            fingerprint: sizeFingerprint,
            width,
            viewportHeight: globalThis.innerHeight,
            dark: globalThis.matchMedia("(prefers-color-scheme: dark)").matches,
            scale: globalThis.devicePixelRatio,
            height: Math.ceil(height),
          });
          if (size !== lastSize) {
            lastSize = size;
            pendingSize = size;
            globalThis.clearTimeout(sizeWriteTimeout);
            sizeWriteTimeout = globalThis.setTimeout(persistSize, 100);
          }
        }
      }
      if (isShare) {
        // Keep unusually tall content accessible without accepting an unbounded height.
        if (height > 10_000 && Number.parseFloat(frame.style.height) === 0) {
          frame.style.removeProperty("height");
        }
        frame.scrolling = height > 10_000 ? "auto" : "no";
        document.documentElement.classList.add("visualization-share-ready");
      }
      return;
    }
    if (data.type === "scroll-to") {
      const top = data.top;
      if (
        typeof top === "number" &&
        Number.isFinite(top) &&
        top >= 0 &&
        globalThis.navigator.userActivation?.isActive === true
      ) {
        globalThis.scrollTo({
          top: Math.ceil(
            globalThis.scrollY + frame.getBoundingClientRect().top + top,
          ),
        });
      }
      return;
    }
    if (data.type === "open-external") {
      const rawHref = data.href;
      if (typeof rawHref !== "string") {
        return;
      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;
      } catch {
        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
      return;
    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!isShare && (!Number.isFinite(height) || height <= viewportHeight)) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  // Match the trusted bootstrap element, not the same text in an authored title.
  const frameHtml = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  if (isShare && storage != null) {
    // Fingerprint the rendered document, including restored widget state, without
    // storing its content. This is a layout cache, not a security identity.
    let hash = 5381;
    for (let index = 0; index < frameHtml.length; index += 1) {
      hash = (hash * 33 + frameHtml.charCodeAt(index)) % 4_294_967_296;
    }
    sizeFingerprint = hash.toString(36);
    try {
      const size = JSON.parse(storage.getItem(sizeStorageKey) ?? "null");
      if (
        size?.fingerprint === sizeFingerprint &&
        size.width === frame.clientWidth &&
        size.viewportHeight === globalThis.innerHeight &&
        size.dark ===
          globalThis.matchMedia("(prefers-color-scheme: dark)").matches &&
        size.scale === globalThis.devicePixelRatio &&
        typeof size.height === "number" &&
        Number.isFinite(size.height) &&
        size.height >= 0 &&
        size.height <= 10_000
      ) {
        frame.style.height = size.height + "px";
      }
    } catch {
      // Ignore missing or invalid cache entries and measure the live frame.
    }
  }
  frame.srcdoc = frameHtml;
  delete frame.dataset.srcdoc;
})();
</script>
</body>
</html>
