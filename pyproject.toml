[project]
name = "llm-from-zero"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.7,<9",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "tensorboard>=2.20,<3",
    "tokenizers==0.22.2",
    "torch>=2.14.1",
    "tqdm>=4.67,<5",
]

[project.optional-dependencies]
inference = [
    "transformers==4.57.3",
]
sft = [
    "accelerate==1.10.1",
    "peft==0.17.1",
    "transformers==4.57.3",
]
pretraining = [
    "huggingface-hub>=0.34,<1",
    "pyarrow>=18,<27",
]
